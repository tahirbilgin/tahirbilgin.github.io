<footer>TAHİR AI LAB · Fıkıh ilminin temel ilkeleri · Eğitim amaçlı kavram keşif kartı</footer></main><script type="application/json" id="card-data">{"title": "Kamu Yararının Gözetilmesi", "lessons": [{"name": "Maslahat ve ortak fayda", "place": "Eğitim yapısı", "title": "Toplumun yararını gerçekleştirmek", "flow": ["İhtiyacı belirle", "Ortak faydayı gözet", "Hizmeti ulaştır"], "paragraphs": ["İslam hukukunda kamu yararı, maslahat kavramıyla ifade edilir. Maslahat; insanların dünyada ve ahirette yararını gerçekleştirmeyi, zarar ve sıkıntılarını gidermeyi anlatır.", "Kamu hizmetlerinde hedef, yalnızca belli kişilerin çıkarını değil toplumun genel faydasını gözetmektir. Yöneticiler, kararlarının toplumun farklı kesimlerine etkilerini dikkate almalıdır.", "Eğitim yapıları, Kur’an kursları, yollar, köprüler, camiler, hanlar ve kervansaraylar; ortak ihtiyaçlara hizmet etme açısından düşünülebilecek örneklerdir. Bir hizmetin kamuya yararı, insanların gerçek ihtiyaçlarını karşılaması ve haklarına saygı göstermesiyle birlikte değerlendirilir."], "key": "Maslahat: Yararı gerçekleştirmek, zarar ve sıkıntıyı gidermek.", "question": "Bir okulun yapılacağı yer belirlenirken yalnızca birkaç kişinin isteği mi, çevredeki öğrencilerin eğitim ihtiyacı mı esas alınmalıdır?", "answer": "Toplumun gerçek eğitim ihtiyacı esas alınmalıdır. Öğrencilerin ulaşımı, hizmete erişimi ve ilgili kişilerin hakları birlikte gözetilir."}, {"name": "Yönetimde adalet", "place": "Sağ üstteki kamusal yapı", "title": "Kararlar kişisel çıkara göre verilmez", "flow": ["Karar ve sorumluluk", "Adalet ve iyilik", "Toplumun genel faydası"], "paragraphs": ["Yöneticiler, aldıkları kararların yalnızca bazı kişilerin çıkarına değil toplumun genel yararına hizmet etmesine dikkat etmelidir. Kamu kaynaklarının kişisel menfaatler için kullanılması, kamu yararıyla bağdaşmaz.", "Kamu yararının ihlali, kişilerin haklarını ve kul haklarını da zedeleyebilir. Bu nedenle adalet, kamu hizmetinin hem amacında hem uygulanışında gözetilir.", "Nahl suresinin 90. ayeti; adaleti ve iyiliği emretmesi, kötülük ve zulmü yasaklaması yönüyle yönetimde adaletin önemini düşünmemize yardımcı olur."], "quote": "“Şüphesiz Allah, adaleti, iyilik yapmayı, akrabaya yardım etmeyi emreder; hayâsızlığı, kötülüğü ve zulmü de yasaklar.”", "citation": "Nahl suresi, 16/90 · Paylaşılan metindeki alıntı", "key": "Ortak hizmette ölçü: Kişisel menfaat değil, adalet ve toplumun faydası.", "question": "Bir hizmetin yerini, yöneticinin yakınına kazanç sağlaması için değiştirmek kamu yararına uygun olur mu?", "answer": "Hayır. Karar gerçek toplumsal ihtiyaç ve adalet ölçüsüyle verilmelidir; belirli kişilerin çıkarı ortak faydanın önüne geçirilmemelidir."}, {"name": "Kamu yararı ve kişisel haklar", "place": "Baraj ve su yapıları", "title": "Ortak fayda sağlanırken kişinin hakkı korunur", "flow": ["Gerçek toplumsal ihtiyaç", "Kişisel hakkı gözet", "Adil karşılık ve tazmin"], "paragraphs": ["Bazı durumlarda toplum için önemli bir fayda sağlayacak proje, bir kişinin malını veya hakkını etkileyebilir. Kamu yararının öncelikli tutulması, kişisel hakkın yok sayılabileceği anlamına gelmez.", "Paylaştığınız örnekte, sel riskine karşı yapılacak bir baraj birçok insanın can ve mal güvenliğini korur. Ancak proje alanındaki bir kişinin arazisi etkilenebilir.", "Bu durumda kişinin hakkı korunur; arazinin değeri adaletli biçimde karşılanır ve uğranan zarar gözetilir. Böylece toplumun ihtiyacının giderilmesiyle kişinin hakkının güvence altına alınması birlikte düşünülür.", "“Kamu yararı” ifadesi tek başına her müdahaleyi haklı kılan bir gerekçe değildir. Gerçek ihtiyaç, adalet ve hakların korunması birlikte değerlendirilmelidir."], "key": "Toplumun faydası + kişinin hakkı + adaletli tazmin.", "question": "Baraj çok sayıda insanı koruyacak diye, etkilenen kişinin arazisi karşılıksız alınabilir mi?", "answer": "Hayır. Bu eğitim örneğinde ortak fayda gerçekleştirilirken arazi sahibinin hakkı da korunur; değerin adaletli biçimde karşılanması ve zararın giderilmesi gözetilir."}, {"name": "Zararı önleme ve tazmin", "place": "Terazi ve erişilebilir meydan", "title": "Fayda sağla, zarar verme, hakkı gözet", "flow": ["Zararı önle", "Hakkı koru", "Oluşan zararı gider"], "paragraphs": ["Peygamber Efendimizin “Zarar vermek de zarara zararla karşılık vermek de yoktur.” sözü, haksız zararı önlemeyi ve bir zararı yeni bir haksızlıkla karşılamamayı hatırlatır.", "Kamu yararı için yapılan düzenlemelerde insanların zarar görmemesi gözetilir. Oluşan zararların giderilmesi ve hakların korunması, adalet düşüncesinin bir parçasıdır.", "Görseldeki erişilebilir rampa, tekerlekli sandalye kullanan kişilerin ulaşımını; sarı kılavuz yüzey ise görme engelli kişilerin güvenli hareketini destekleyen hizmetleri temsil eder. Toplumun yararı, farklı ihtiyaçları olan insanların hizmetlere erişimini de kapsar.", "Merkezdeki terazi, ortak faydayı sağlarken kişisel hakları koruma sorumluluğunu simgeler. Kamu yararını gözetmek; adalet, kul hakkına saygı ve zararı önleme ile birlikte düşünülür."], "key": "Kamu hizmeti: İnsanlara yarar sağlamak ve zararlarını önlemek.", "question": "Yeni bir kaldırım yapılırken erişilebilir rampa ve görme engelliler için kılavuz yüzeylerin düşünülmesi bu ilkeyle nasıl ilişkilidir?", "answer": "Hizmetin farklı ihtiyaçları olan insanlara da yarar sağlamasını ve engellerin azaltılmasını hedefler. Böylece ortak fayda ve zararı önleme birlikte gözetilir."}]}</script><script src="./concept-cards-layout.js?v=20261023-2" defer></script></body></html>
