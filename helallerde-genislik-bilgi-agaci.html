<footer>Kaynak: MEB DÖGM, Fıkıh, 1. Ünite, s. 18 · Açıklamalar ders kitabı temel alınarak düzenlendi; düşünme soruları öğrenmeyi pekiştirmek için eklendi.</footer>

<script>
'use strict';
const lessons=[{"id": "mubah", "name": "Mübahlık", "title": "Eşyada asıl olan mübahlıktır.", "flow": ["Eşya ve nimetler", "Yasaklayıcı nas yok", "Asıl: mübahlık"], "paragraphs": ["İslam hukukunda, hakkında yasaklayıcı bir nas bulunmayan şeylerde esas olan mübahlıktır. Bu yüzden helaller temel alanı, haramlar ise istisnaları oluşturur.", "Nas, bir hükme dayanak olan Kur’an veya sünnet metnidir. Mübah ise yapılması veya terk edilmesi konusunda kişiye serbestlik tanınan şeyi ifade eder.", "Ders kitabında aktarılan hadisin anlamına göre helal ve haram, Allah’ın kitabı ve ona dayalı sünnetle belirlenir; hakkında yasak belirtilmeyen şeyler serbest bırakılmıştır. Kişisel beğeniler tek başına bir şeyi haram saymaya yeterli değildir."], "key": "Helaller asıl, haramlar istisnadır.", "example": "Düşün: Bir meyveyi sevmemek, onun haram olduğunu söylemek için gerekçe olabilir mi?", "answer": "Hayır. Kişisel tercih ile dinî hüküm farklıdır; helal ve haram konusunda hükme dayanak gerekir."}, {"id": "temiz", "name": "Helal ve temiz", "title": "Nimetleri helal ve temiz ölçüsüyle değerlendir.", "flow": ["Nimet", "Helal ve temiz", "Bilinçli yararlanma"], "paragraphs": ["Helallerde genişlik ilkesi, insanın yeryüzündeki nimetlerden meşru biçimde yararlanabileceğini gösterir. Bu geniş alan, helallik ve temizlik ölçüleriyle birlikte düşünülür.", "Bakara suresinin 168. ayetinde insanlara yeryüzündeki helal ve temiz şeylerden yemeleri bildirilir. Ders kitabı bu ayeti, helal alanın genişliğine dayanak olarak verir.", "Helal, dinen izin verilen alanı anlatır. Temizlik ve uygunluk da nimetlerden yararlanırken gözetilir. Beslenme örneği bu ilkeyi görünür kılar; ancak helallerde genişlik yalnızca yiyeceklerle sınırlı değildir."], "quote": "“Ey insanlar, yeryüzündeki şeylerin helal ve temiz olanlarından yiyin…”", "reference": "Bakara suresi, 168. ayet · Ders kitabındaki alıntı", "key": "Geniş nimet alanı + helal ve temiz ölçüsü.", "example": "Örnek: Meyve, ekmek ve su, günlük hayatta yararlanılan nimetlerdendir. Bunları değerlendirirken neye dikkat edilir?", "answer": "Helal ve temiz olmalarına; bunlardan meşru şartlar içinde yararlanmaya dikkat edilir."}, {"id": "ihtiyac", "name": "Meşru ihtiyaçlar", "title": "İhtiyaçları karşılayacak geniş bir helal alan vardır.", "flow": ["Maddi ve manevi ihtiyaç", "Meşru yollar", "Helal imkânlar"], "paragraphs": ["İslam’da insanı harama muhtaç bırakmayacak kadar helal imkân vardır. Ders kitabı, ruh ve beden için faydalı olan şeylerin helal alan içinde yer aldığını vurgular.", "İnsanın maddi ve manevi ihtiyaçlarını karşılayacak şeylerden, meşru şartlar çerçevesinde yararlanmasına izin verilmiştir. Helallerde genişlik, hayatın yalnızca bir bölümünü değil ihtiyaçların farklı yönlerini kapsar.", "Bu çerçevede beslenme, öğrenme, çalışma ve aile hayatı gibi alanlarda meşru imkânlar düşünülebilir. Bir ihtiyacın bulunması, o ihtiyacı karşılamanın her yolunu kendiliğinden helal yapmaz; yolun ve şartların da meşru olması gerekir."], "key": "İhtiyaç vardır → meşru yol seçilir → helal imkândan yararlanılır.", "example": "Düşün: Kazanç elde etmek isteyen biri için dürüst ticaret ile kumar aynı şekilde değerlendirilebilir mi?", "answer": "Hayır. İhtiyacın bulunması her yöntemi meşru kılmaz. Dürüst ticaret meşru kazanç yollarına örnektir; kumar ise ders kitabında yasaklanan zararlı davranışlar arasında sayılır."}, {"id": "sinir", "name": "Koruyucu sınırlar", "title": "Haramlar sınırlıdır; yasaklar zararları önler.", "flow": ["Bireysel veya toplumsal zarar", "Belirlenmiş yasaklar", "Korunan insan ve toplum"], "paragraphs": ["İslam’da haramlar sınırlı olduğundan nelerin haram olduğu belirtilmiştir. Helaller ise çok sayıda olduğu için tek tek sayılmamıştır. Bu, helal alanın genişliğini anlamamızı sağlar.", "Ders kitabında içki, kumar ve zina; kişinin veya toplumun maddi ve manevi yapısına zarar veren, bu sebeple yasaklanmış davranışlara örnek gösterilir.", "Görseldeki küçük kapalı kapı, bu sınırlı yasakları temsil eder. Büyük ve açık bahçe ise çok sayıdaki helal imkânı simgeler. Bu benzetme bir öğrenme aracıdır; dinî hükümlerin kaynağı Kur’an ve sünnettir."], "key": "Helaller çok olduğu için sayılmaz; sınırlı haramlar belirtilir.", "example": "Düşün: “Haramlar sınırlıysa, onları önemsemeye gerek yoktur.” sonucu doğru mudur?", "answer": "Hayır. Helal alanın genişliği, belirtilmiş yasakları ortadan kaldırmaz. Kişi geniş helal imkânlardan yararlanırken bu sınırları da gözetir."}];
const cover=document.getElementById('cover-screen'),tree=document.getElementById('tree-screen'),overlay=document.getElementById('lesson-overlay'),content=document.getElementById('lesson-content'),closeButton=document.getElementById('close-lesson'),buttons=[...document.querySelectorAll('[data-lesson]')];
document.getElementById('tree-image').src=document.getElementById('cover-image').src;
let selected=0,returnFocus=null;const visited=new Set();
document.getElementById('enter-tree').addEventListener('click',()=>{cover.hidden=true;tree.hidden=false;window.scrollTo(0,0);buttons[0].focus({preventScroll:true});});
document.getElementById('return-cover').addEventListener('click',()=>{tree.hidden=true;cover.hidden=false;window.scrollTo(0,0);document.getElementById('enter-tree').focus({preventScroll:true});});
function showLesson(index){selected=index;const d=lessons[index];visited.add(index);document.getElementById('progress').textContent=visited.size+' / 4 bölüm keşfedildi';buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(visited.has(i))));document.getElementById('lesson-name').textContent=d.name+' · '+(index+1)+' / 4';content.innerHTML='<h3 id="lesson-title">'+d.title+'</h3><div class="steps" aria-label="Kavram bağlantıları">'+d.flow.map((x,i)=>(i?'<span class="arrow" aria-hidden="true">→</span>':'')+'<div class="step">'+x+'</div>').join('')+'</div><div class="lesson-section">'+d.paragraphs.map(x=>'<p>'+x+'</p>').join('')+'</div>'+(d.quote?'<blockquote>'+d.quote+'<cite>'+d.reference+'</cite></blockquote>':'')+'<div class="highlight">'+d.key+'</div><div class="question"><p>'+d.example+'</p><button class="reveal" id="reveal-answer" aria-expanded="false" aria-controls="answer-text">Açıklamayı göster</button><div class="answer-text" id="answer-text" hidden>'+d.answer+'</div></div><div class="source">Kaynak: <a href="https://dogm.eba.gov.tr/panel/upload/etkilesimli/kitap/fkh/unite1/files/basic-html/page8.html" target="_blank" rel="noopener noreferrer">MEB DÖGM · Fıkıh 1. Ünite, s. 18 ↗</a></div>';document.getElementById('prev-lesson').disabled=index===0;document.getElementById('next-lesson').disabled=index===lessons.length-1;overlay.hidden=false;document.body.style.overflow='hidden';document.getElementById('reveal-answer').addEventListener('click',e=>{const a=document.getElementById('answer-text');a.hidden=!a.hidden;e.currentTarget.setAttribute('aria-expanded',String(!a.hidden));e.currentTarget.textContent=a.hidden?'Açıklamayı göster':'Açıklamayı gizle';});overlay.querySelector('.dialog').scrollTop=0;closeButton.focus();}
buttons.forEach(b=>b.addEventListener('click',()=>{returnFocus=b;showLesson(Number(b.dataset.lesson));}));
function closeLesson(){overlay.hidden=true;document.body.style.overflow='';if(returnFocus)returnFocus.focus({preventScroll:true});}
closeButton.addEventListener('click',closeLesson);overlay.addEventListener('click',e=>{if(e.target===overlay)closeLesson();});document.getElementById('prev-lesson').addEventListener('click',()=>{if(selected>0)showLesson(selected-1);});document.getElementById('next-lesson').addEventListener('click',()=>{if(selected<lessons.length-1)showLesson(selected+1);});document.addEventListener('keydown',e=>{if(overlay.hidden)return;if(e.key==='Escape')closeLesson();if(e.key==='Tab'){const focusable=[...overlay.querySelectorAll('button:not(:disabled),a[href]')],first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
</script></body></html>
