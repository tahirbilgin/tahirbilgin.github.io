<footer>TAHİR AI LAB · Fıkıh ilminin temel ilkeleri · Eğitim amaçlı kavram keşif kartı</footer></main><script type="application/json" id="card-data">{"title": "Helallerde Genişlik", "lessons": [{"id": "mubah", "name": "Mübahlık", "title": "Eşyada asıl olan mübahlıktır.", "flow": ["Eşya ve nimetler", "Yasaklayıcı nas yok", "Asıl: mübahlık"], "paragraphs": ["İslam hukukunda, hakkında yasaklayıcı bir nas bulunmayan şeylerde esas olan mübahlıktır. Bu yüzden helaller temel alanı, haramlar ise istisnaları oluşturur.", "Nas, bir hükme dayanak olan Kur’an veya sünnet metnidir. Mübah ise yapılması veya terk edilmesi konusunda kişiye serbestlik tanınan şeyi ifade eder.", "Ders kitabında aktarılan hadisin anlamına göre helal ve haram, Allah’ın kitabı ve ona dayalı sünnetle belirlenir; hakkında yasak belirtilmeyen şeyler serbest bırakılmıştır. Kişisel beğeniler tek başına bir şeyi haram saymaya yeterli değildir."], "key": "Helaller asıl, haramlar istisnadır.", "example": "Düşün: Bir meyveyi sevmemek, onun haram olduğunu söylemek için gerekçe olabilir mi?", "answer": "Hayır. Kişisel tercih ile dinî hüküm farklıdır; helal ve haram konusunda hükme dayanak gerekir."}, {"id": "temiz", "name": "Helal ve temiz", "title": "Nimetleri helal ve temiz ölçüsüyle değerlendir.", "flow": ["Nimet", "Helal ve temiz", "Bilinçli yararlanma"], "paragraphs": ["Helallerde genişlik ilkesi, insanın yeryüzündeki nimetlerden meşru biçimde yararlanabileceğini gösterir. Bu geniş alan, helallik ve temizlik ölçüleriyle birlikte düşünülür.", "Bakara suresinin 168. ayetinde insanlara yeryüzündeki helal ve temiz şeylerden yemeleri bildirilir. Ders kitabı bu ayeti, helal alanın genişliğine dayanak olarak verir.", "Helal, dinen izin verilen alanı anlatır. Temizlik ve uygunluk da nimetlerden yararlanırken gözetilir. Beslenme örneği bu ilkeyi görünür kılar; ancak helallerde genişlik yalnızca yiyeceklerle sınırlı değildir."], "quote": "“Ey insanlar, yeryüzündeki şeylerin helal ve temiz olanlarından yiyin…”", "reference": "Bakara suresi, 168. ayet · Ders kitabındaki alıntı", "key": "Geniş nimet alanı + helal ve temiz ölçüsü.", "example": "Örnek: Meyve, ekmek ve su, günlük hayatta yararlanılan nimetlerdendir. Bunları değerlendirirken neye dikkat edilir?", "answer": "Helal ve temiz olmalarına; bunlardan meşru şartlar içinde yararlanmaya dikkat edilir."}, {"id": "ihtiyac", "name": "Meşru ihtiyaçlar", "title": "İhtiyaçları karşılayacak geniş bir helal alan vardır.", "flow": ["Maddi ve manevi ihtiyaç", "Meşru yollar", "Helal imkânlar"], "paragraphs": ["İslam’da insanı harama muhtaç bırakmayacak kadar helal imkân vardır. Ders kitabı, ruh ve beden için faydalı olan şeylerin helal alan içinde yer aldığını vurgular.", "İnsanın maddi ve manevi ihtiyaçlarını karşılayacak şeylerden, meşru şartlar çerçevesinde yararlanmasına izin verilmiştir. Helallerde genişlik, hayatın yalnızca bir bölümünü değil ihtiyaçların farklı yönlerini kapsar.", "Bu çerçevede beslenme, öğrenme, çalışma ve aile hayatı gibi alanlarda meşru imkânlar düşünülebilir. Bir ihtiyacın bulunması, o ihtiyacı karşılamanın her yolunu kendiliğinden helal yapmaz; yolun ve şartların da meşru olması gerekir."], "key": "İhtiyaç vardır → meşru yol seçilir → helal imkândan yararlanılır.", "example": "Düşün: Kazanç elde etmek isteyen biri için dürüst ticaret ile kumar aynı şekilde değerlendirilebilir mi?", "answer": "Hayır. İhtiyacın bulunması her yöntemi meşru kılmaz. Dürüst ticaret meşru kazanç yollarına örnektir; kumar ise ders kitabında yasaklanan zararlı davranışlar arasında sayılır."}, {"id": "sinir", "name": "Koruyucu sınırlar", "title": "Haramlar sınırlıdır; yasaklar zararları önler.", "flow": ["Bireysel veya toplumsal zarar", "Belirlenmiş yasaklar", "Korunan insan ve toplum"], "paragraphs": ["İslam’da haramlar sınırlı olduğundan nelerin haram olduğu belirtilmiştir. Helaller ise çok sayıda olduğu için tek tek sayılmamıştır. Bu, helal alanın genişliğini anlamamızı sağlar.", "Ders kitabında içki, kumar ve zina; kişinin veya toplumun maddi ve manevi yapısına zarar veren, bu sebeple yasaklanmış davranışlara örnek gösterilir.", "Görseldeki küçük kapalı kapı, bu sınırlı yasakları temsil eder. Büyük ve açık bahçe ise çok sayıdaki helal imkânı simgeler. Bu benzetme bir öğrenme aracıdır; dinî hükümlerin kaynağı Kur’an ve sünnettir."], "key": "Helaller çok olduğu için sayılmaz; sınırlı haramlar belirtilir.", "example": "Düşün: “Haramlar sınırlıysa, onları önemsemeye gerek yoktur.” sonucu doğru mudur?", "answer": "Hayır. Helal alanın genişliği, belirtilmiş yasakları ortadan kaldırmaz. Kişi geniş helal imkânlardan yararlanırken bu sınırları da gözetir."}]}</script><script src="./concept-cards-layout.js?v=20261023-2" defer></script></body></html>
