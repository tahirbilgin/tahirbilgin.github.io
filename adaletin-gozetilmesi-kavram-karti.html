<footer>TAHİR AI LAB · Fıkıh ilminin temel ilkeleri · Eğitim amaçlı kavram keşif kartı</footer></main><script type="application/json" id="card-data">{"title": "Adaletin Gözetilmesi", "lessons": [{"name": "Doğru şahitlik", "place": "Sol üst · Şahitlik sahnesi", "title": "Yakınlarımızın aleyhine de olsa doğruyu söylemek", "flow": ["Gerçeği bilmek", "Çıkara uymamak", "Doğru şahitlik"], "paragraphs": ["Adalet; herkese hakkını vermek, hak ve hukuka uygun davranmak, eşitlik ve hakkaniyeti sağlamaktır. İslam hukukunda bireysel ilişkilerden yönetim ve yargıya kadar temel bir ölçüdür.", "Doğru şahitlik, gerçeği kişisel çıkarlarımızdan ve yakınlık ilişkilerimizden üstün tutmayı gerektirir. Bir kişinin yakınımız olması, onun lehine gerçeği değiştirmemizi haklı kılmaz.", "Nisâ suresinin 135. ayeti, kişinin kendisi, anne babası ve yakınları aleyhine bile olsa adaleti titizlikle ayakta tutmasını ister. Zenginlik veya fakirlik de bu sorumluluğu değiştirmez.", "Örnek: Bir olaya tanık olan kişi, haksız davrananın kendi ailesinden biri olduğunu görse de bildiği gerçeği söylemelidir. Yakınını koruma isteği, başka birinin hakkının zedelenmesine gerekçe olamaz."], "quotes": [{"text": "“Ey iman edenler! Kendiniz, ana babanız ve en yakınlarınızın aleyhine de olsa Allah için şahitlik yaparak adaleti titizlikle ayakta tutan kimseler olun…”", "ref": "Nisâ suresi, 4/135 · Paylaşılan metindeki alıntı"}], "key": "Adaletin ölçüsü: Kişisel yakınlık değil, hak ve gerçektir.", "question": "Bir arkadaşın, kendi hatasını gizlemek için senden olayın farklı olduğunu söylemeni isterse ne yapmalısın?", "answer": "Gerçeği söylemeli, yanlış şahitlikten kaçınmalısın. Dostluk, başkasının hakkının çiğnenmesini haklı kılmaz.", "url": "https://kuran.diyanet.gov.tr/mushaf/kuran-meal-1/nisa-suresi-4/ayet-135/diyanet-isleri-baskanligi-meali-1", "source": "Nisâ 4/135 · Diyanet"}, {"name": "Tarafsız hüküm", "place": "Sağ üst · Hüküm verme sahnesi", "title": "Kararı kişiye göre değil, hak ve delile göre vermek", "flow": ["Tarafları dinle", "Delilleri değerlendir", "Adaletle hükmet"], "paragraphs": ["Yöneticiler ve hâkimler için adalet esastır. Bir konuda karar verirken kişilerin zenginliği, fakirliği, tanıdık veya yabancı oluşu hakkın önüne geçmemelidir.", "Nisâ suresinin 58. ayeti, emanetleri ehline vermeyi ve insanlar arasında adaletle hükmetmeyi emreder. Görev ve yetki bir sorumluluktur; kişisel ayrıcalık aracı değildir.", "Peygamber Efendimiz, adaletle hüküm verenleri ve ailesine, yönetimi altındakilere adil davrananları övmüştür. Adil davranma sorumluluğu yalnızca mahkemede değil, aile ve yönetim ilişkilerinde de vardır.", "Örnek: Bir hâkim, taraflardan birini tanıyor olsa bile delillere göre karar vermelidir. Benzer biçimde bir öğretmen değerlendirme yaparken öğrenciler arasında kayırmacılıktan kaçınmalıdır."], "quotes": [{"text": "“Şüphesiz Allah size emanetleri ehline vermenizi ve insanlar arasında hükmettiğinizde adaletle hükmetmenizi emrediyor.”", "ref": "Nisâ suresi, 4/58 · Paylaşılan metindeki alıntı"}, {"text": "“Adaletle hüküm verenler, ailesine ve yönetimi altındakilere karşı âdil davrananlar, kıyamet gününde nurdan minberler üzerinde olacaklardır.”", "ref": "Müslim, İmâre, 18 · Paylaşılan metindeki aktarım"}], "key": "Tarafsızlık: Unvana, servete veya yakınlığa göre değil, hakka göre karar vermek.", "question": "Bir davada taraflardan biri güçlü ve zengin, diğeri maddi imkânları sınırlıysa kararın temel ölçüsü ne olmalıdır?", "answer": "Tarafların sosyal konumu değil, hak, hukuk ve deliller esas alınmalıdır. Her iki taraf da adil biçimde dinlenmelidir.", "url": "https://kuran.diyanet.gov.tr/tefsir/Nahl-suresi/1991/90-ayet-tefsiri", "source": "Adalet ve hadis açıklamaları · Diyanet"}, {"name": "Hakkın iadesi", "place": "Sol orta · Emanetin sahibine verilmesi", "title": "Hakkı hak sahibine teslim etmek", "flow": ["Hakkı tanı", "İhlali gider", "Hakkı sahibine ver"], "paragraphs": ["Adaletin gözetilmesi, hakkı yalnızca bilmekle sınırlı değildir; hakkın sahibine verilmesini de gerektirir. Kişilerin malı, emeği ve diğer hakları karşısında sorumluluk taşırız.", "Peygamber Efendimiz, kıyamet gününde hakların sahiplerine verileceğini, boynuzsuz koyunun hakkının boynuzlu koyundan bile alınacağını bildirmiştir. Bu anlatım, hakların ve hesap verme sorumluluğunun önemini vurgular.", "Görselde kayıp bir eşyanın sahibine verilmesi, hakkın iadesini temsil eder. Bize ait olmayan bir şeyi sahibine ulaştırmak veya alınmış bir hakkı geri vermek, adaleti günlük hayatta görünür kılar.", "Sonuç olarak adalet; nefse ve çıkarlara uymadan, hak sahibini gözetmeyi gerektirir. Haksızlığın giderilmesi ve hakların teslimi, güvenin yeniden kurulmasına da katkı sağlar."], "quotes": [{"text": "“Kıyamet gününde mutlaka haklar sahiplerine verilecektir. Hatta boynuzlu koyundan boynuzsuz koyunun hakkı bile alınacaktır.”", "ref": "Müslim, Birr, 60 · Paylaşılan metindeki aktarım"}], "key": "Hak, güçlü olanın elinde kalması gereken bir ayrıcalık değil; sahibine verilmesi gereken bir değerdir.", "question": "Bulduğun bir çantanın sahibini biliyorsan, onu kendin için kullanmak yerine ne yapmalısın?", "answer": "Eşyayı sahibine ulaştırmalısın. Eşyanın eline geçmiş olması, onun üzerinde hak sahibi olduğun anlamına gelmez.", "url": "https://isamveri.org/pdfdrg/D03416/2019_66/2019_66_ACIKELY.pdf", "source": "Paylaşılan hadis kaynağı · İSAM"}, {"name": "Toplumsal huzur", "place": "Sağ orta · Yardımlaşma ve güven sahnesi", "title": "Adalet, güven ve dayanışmayı güçlendirir", "flow": ["Haklara saygı", "Güven ve dayanışma", "Huzurlu toplum"], "paragraphs": ["Adaletin gözetildiği toplumda insanların birbirlerine ve kurumlara güveni güçlenir. Haklarının korunacağını bilen kişiler, toplumsal hayata daha güvenli katılır.", "Kur’an, adaleti ve iyiliği emrederken kötülük ve zulmü yasaklar. Nahl suresinin 90. ayeti, adaletin toplumsal yaşamdaki önemini hatırlatır.", "Adaletsizlik ise zulme, korkuya ve huzursuzluğa zemin hazırlar. “Zulüm ile âbâd olanın ahiri berbat olur.” sözü, haksızlık üzerine kurulan düzenin iyi sonuç vermeyeceğini anlatan bir öğüttür.", "Adaletin gözetilmesi; herkese hakkını vermek, eşit haklara saygı göstermek, hakkaniyeti sağlamak ve kişisel çıkarların etkisinden uzak durmaktır. Bu ilke, huzurlu toplum ve adil yönetimin temelidir."], "quotes": [{"text": "“Şüphesiz Allah, adaleti, iyilik yapmayı, yakınlara yardım etmeyi emreder; hayâsızlığı, fenalık ve azgınlığı da yasaklar.”", "ref": "Nahl suresi, 16/90 · Paylaşılan metindeki alıntı"}], "key": "Adalet → güven → huzur ve dayanışma. Adaletsizlik → zulüm ve huzursuzluk.", "question": "Aynı kuralların herkese adil biçimde uygulandığı bir okulda öğrencilerin güveni nasıl etkilenir?", "answer": "Öğrenciler haklarının gözetildiğini hisseder; okula ve birbirlerine duydukları güven güçlenir. Kayırmacılık ise bu güveni zedeler.", "url": "https://kuran.diyanet.gov.tr/tefsir/Nahl-suresi/1991/90-ayet-tefsiri", "source": "Nahl 16/90 · Diyanet"}]}</script><script src="./concept-cards-layout.js?v=20261023-3" defer></script></body></html>
