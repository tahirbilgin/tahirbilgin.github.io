<footer>TAHİR AI LAB · Fıkıh ilminin temel ilkeleri · Eğitim amaçlı kavram keşif kartı</footer></main><script type="application/json" id="card-data">{"title":"Teklifte Kolaylık","lessons":[{"name":"Kavramın özü","title":"Kolaylığın kökünde ne var?","paragraphs":["Teklif, dinî emir ve yasaklarla yükümlü tutulmadır. Teklifte kolaylık, yükümlülüklerde insanın gücünün ve içinde bulunduğu şartların gözetilmesini ifade eder.","Teklif, Allah’ın insanı dinî emir ve yasaklardan sorumlu tutmasıdır. Mükellef, dinî sorumluluğun muhatabı olan, akıl ve bulûğ gibi şartları taşıyan kişidir. Yükümlülüğün yerine getirilişinde kişinin sağlığı, gücü ve imkânı gözetilir.","Azimet, normal şartlarda geçerli olan genel hükümdür; sağlıklı ve imkânı olan kişinin suyla abdest alması veya Ramazan orucunu tutması buna örnektir.","Ruhsat, dinin tanıdığı bir mazeret sebebiyle yararlanılabilen kolaylıktır. Hastalık, yolculuk veya su bulunamaması gibi durumlarda ilgili şartlara göre uygulanır.","Bu ilkenin amacı insanın zarar görmesini önlemek ve kulluğunu gücü ölçüsünde sürdürebilmesini sağlamaktır. Kolaylık, ibadetleri kişinin isteğine göre bırakması anlamına gelmez."],"flow":["Yükümlülük","Güç yetirme","Kolaylık"],"key":"Ana fikir: Sorumlulukta kişinin gücü ve şartları gözetilir; ibadet, meşru kolaylıklarla sürdürülür.","url":"https://kuran.diyanet.gov.tr/mushaf/kuran-meal-1/bakara-suresi-2/ayet-286/diyanet-isleri-baskanligi-meali-1","source":"Diyanet · Bakara 2/286"},{"name":"Bağlantıyı kur","title":"Azimetten ruhsata bir bağlantı","paragraphs":["Azimet normal şartlarda geçerli olan asıl hükümdür. Ruhsat, bir mazeret sebebiyle tanınan kolaylıktır. Bu bağlantı, teklifte kolaylık ilkesini anlamamıza yardımcı olur.","Kur’an’daki dayanaklar: Bakara 2/286, insanın gücünün üzerinde sorumlu tutulmayacağını bildirir. Hac 22/78, dinde güçlük yüklenmediğini; Bakara 2/185 ise özellikle oruç bağlamında Allah’ın kulları için kolaylık istediğini vurgular.","Hadislerdeki dayanaklar: Hz. Peygamber dinin kolaylık olduğunu bildirir (Buhârî, Îmân, 29). Kolaylaştırmayı, zorlaştırmamayı; müjdelemeyi ve insanları uzaklaştırmamayı öğütler (Buhârî, İlim, 11).","Mecelle md. 17 — “Meşakkat teysiri celbeder”: Dinen dikkate alınan zorluk, kolaylaştırma sebebidir.","Mecelle md. 18 — “Bir iş dıyk oldukta müttesi olur”: Bir işte darlık ve güçlük ortaya çıktığında, şartlarına uygun bir genişlik yolu açılır.","Mecelle md. 21 — “Zaruretler memnu olan şeyleri mübah kılar”: Gerçek bir zaruret, normalde yasak olan bir fiile belirli sınırlar içinde izin verilmesine sebep olabilir. Bu izin, zaruretin gerektirdiği ölçüyü aşmaz.","Bağlantı zinciri: Genel hüküm → Geçerli mazeret → Dinin tanıdığı kolaylık. Her günlük güçlük kendiliğinden ruhsat doğurmaz; kolaylığın şartları ve sınırları birlikte değerlendirilir."],"flow":["Asıl hüküm","Mazeret","Ruhsat"],"url":"https://islamansiklopedisi.org.tr/mesakkat","source":"TDV İslâm Ansiklopedisi · Meşakkat"},{"name":"Hayattan bir örnek","title":"Hastalık durumunda oruç","paragraphs":["Hastalık sebebiyle Ramazan orucunu tutamayan kişi için, şartlarına göre daha sonra kaza etme kolaylığı bulunur. Kişinin durumu gözetilir.","Abdest: Normal şartlarda su ile abdest alınır. Su bulunamadığında veya su kullanılması hastalığa yol açacak ya da mevcut hastalığı artıracaksa, gerekli şartlar oluştuğunda teyemmüm edilir. Temizlik yükümlülüğü, uygun bir yolla yerine getirilir.","Namaz: Ayakta durmaya gücü yetmeyen hasta oturarak; buna da gücü yetmeyen, durumuna uygun biçimde yatarak veya îmâ ile namazını kılar. İbadetin yapılışı kişinin gücüne göre kolaylaştırılır.","Yolculuk: Seferîlik şartlarını taşıyan kişi, ilgili fıkhî hükümlere göre dört rekâtlı farz namazları iki rekât kılar. Yolculuk sona erince sonraki namazlarını normal hükme göre kılmaya devam eder; yolculukta usulüne uygun kıldığı namazları yeniden kılması gerekmez.","Oruç: Geçerli hastalık veya yolculuk mazereti bulunan kişi, tutamadığı Ramazan orucunu daha sonra kaza edebilir. Hamilelik ve emzirmede kişinin kendisine veya bebeğine zarar gelmesi endişesi gibi şartlar değerlendirilir; tutulamayan oruçlar uygun zamanda kaza edilir.","Örnek durum: Doktorun, orucun hastalığını ağırlaştıracağını belirttiği kişi iyileşince kaza etmek üzere orucunu erteleyebilir. Kalıcı hastalık sebebiyle ileride de oruç tutamayacak kişiler içinse fidye gibi farklı hükümler söz konusu olabilir; her durum aynı değildir."],"flow":["Hastalık","Erteleme","Daha sonra kaza"],"key":"Örneklerin ortak yönü: Mazeret dikkate alınır, ibadet için şartlara uygun yol gösterilir.","url":"https://www.diyanet.gov.tr/icerik/881","source":"Diyanet · Oruçta mazeretler ve kaza"},{"name":"Sen karar ver","title":"Bu dalda karar senin","paragraphs":["Karar verirken üç soru sor: Gerçek ve dinen geçerli bir mazeret var mı? Bu mazeret için hangi kolaylık tanınmış? Kolaylığın sınırı ve süresi nedir?","Ruhsat, kişisel isteğe göre yükümlülüklerden vazgeçme yolu değildir. Mazerete bağlı kolaylık, mazeret sürdüğü ölçüde uygulanır; mazeret kalkınca o kolaylığın gerekçesi de ortadan kalkar.","Karşılaştır: Su kullanması sağlığına zarar veren bir kişinin gerekli şartlarda teyemmüm etmesi, teklifte kolaylığın örneğidir. Sırf üşendiği için suyla abdest almaktan vazgeçmesi ise aynı kapsamda değerlendirilemez.","Bir başka karar: Yolculuğu biten kişi, artık yolculuk ruhsatına dayanarak sonraki dört rekâtlı farzları iki rekât kılmaya devam edemez. Geçmişte usulüne uygun kıldığı sefer namazları geçerlidir.","Aşağıdaki soruda, bütün yükümlülüklerin kalkması ile ibadetin şartlara uygun kolaylaştırılması arasındaki farkı düşün."],"flow":["Durumu incele","İlkeyi bul","Karar ver"],"question":"Su kullanması sağlığına zarar veren bir kişi, gerekli şartlar oluştuğunda teyemmüm eder. Bu örnek en doğrudan neyi gösterir?","choices":[{"text":"Şartlara göre kolaylık tanınmasını","feedback":"✓ Doğru. İbadetin yerine getirilmesi için şartlara uygun kolaylık tanınır."},{"text":"Bütün yükümlülüklerin kalkmasını","feedback":"Yeniden düşün: İbadet terk edilmiyor; şartlara uygun bir kolaylık uygulanıyor."}],"key":"Ölçü: Gerçek mazeret + Dinin tanıdığı ruhsat + Şartlara ve sınırlara uyma.","url":"https://yayin.diyanet.gov.tr/File/Download?id=398&path=398_1.pdf","source":"Diyanet · Seyahatte İbadet"}]}</script><script src="./concept-cards-layout.js?v=20261023-5" defer></script></body></html>
