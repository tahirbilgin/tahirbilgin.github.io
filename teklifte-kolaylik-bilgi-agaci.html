<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#082a30"><title>Teklifte Kolaylık — Etkileşimli Bilgi Ağacı | Tahir AI Lab</title></head><body>
<div id="bilgi-agaci" class="viz-dotted-background">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#061a22;color:#fff0cf;font-family:system-ui,sans-serif;padding:20px 10px}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #b9f5db;outline-offset:4px}[hidden]{display:none!important}#bilgi-agaci{max-width:860px;margin:auto}.scene{border:1px solid #496167;border-radius:22px;overflow:hidden;background:#09252d}header,.topline{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:15px 22px}header{font-size:11px;letter-spacing:1.8px;border-bottom:1px solid #33525b}.topline{padding:10px 18px;background:#0b2a31}.back,.close{min-height:44px;padding:9px 14px;background:#143d40;color:#fce8c5;border:1px solid #587773;border-radius:10px}.counter{font-size:12px;color:#c1ded0}.tree{position:relative;aspect-ratio:1122/1402;isolation:isolate}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.leaf{position:absolute;z-index:2;width:33%;height:9.8%;padding:0 4px;background:transparent;color:#38240e;border:0;border-radius:45%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:filter .25s,transform .25s}.leaf strong{font-family:Georgia,serif;font-size:clamp(12px,2.5vw,23px);font-weight:600;display:block;padding:5px 8px;border-radius:50%;background:radial-gradient(ellipse,#fff0caed 30%,#f4d593b3 65%,#f4d59300 74%);text-shadow:0 1px 1px #ffefc6;white-space:nowrap}.leaf small{display:block;font-size:clamp(10px,1.5vw,13px);padding:4px 9px;background:#0b292fe8;color:#fff0c7;border:1px solid #c0a66a80;border-radius:20px;margin-top:3px}.leaf:hover,.leaf[aria-pressed=true]{transform:translateY(-3px);filter:drop-shadow(0 0 14px #f9d987)}.l1{left:7.5%;top:17.9%}.l2{right:7.5%;top:17.9%}.l3{left:7.5%;top:42.3%}.l4{right:7.5%;top:42.3%}.leaf[aria-pressed=true] small:after{content:' ✓';color:#a8ffd5}.title{position:absolute;top:78.5%;left:17%;width:66%;z-index:2;text-align:center;border:0;background:radial-gradient(ellipse,#f8e4b8dd 20%,#f8e4b87a 53%,transparent 72%);padding:18px 5px;color:#402911;text-shadow:0 1px 1px #fff4d1}.title .eyebrow{font-size:clamp(10px,1.8vw,16px);letter-spacing:3px;color:#654825}.title h2{font:500 clamp(22px,5vw,43px)/1.15 Georgia,serif;margin:6px 0}.title small{font-size:clamp(10px,1.6vw,13px)}.trunk-label{display:none}.overlay{position:fixed;inset:0;z-index:20;background:#03171ce6;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:18px}.dialog{width:100%;max-width:650px;max-height:92dvh;overflow:auto;background:linear-gradient(130deg,#153e3d,#0c2531);border:1px solid #c9ad74;border-radius:24px;padding:26px;box-shadow:0 25px 100px #000a;animation:openBook .3s ease-out}.dialog-bar{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;color:#b2e3cc;letter-spacing:1.4px}h3{font:500 29px/1.2 Georgia,serif;color:#ffe0a0;margin:24px 0}p{font-size:16px;line-height:1.75;color:#e5eee6}.steps{display:flex;align-items:center;gap:8px;margin:22px 0}.step{flex:1;text-align:center;background:#1c5248;border:1px solid #729e88;border-radius:20px 6px;padding:18px 6px;font-size:14px}.arrow{color:#efd091}.answers{display:grid;gap:10px}.answer{background:#1c5147;color:#fff0cf;border:1px solid #93b29a;border-radius:12px;padding:14px;text-align:left}.result{margin-top:14px;color:#b5f3cf;line-height:1.6}.cover{position:relative;min-height:520px;display:block;width:100%;border:0;text-align:left;overflow:hidden;background:#0c3338;color:#fff0cf}.cover .art{object-fit:cover}.veil{position:absolute;inset:0;background:linear-gradient(0deg,#061b25 0%,#061b25c9 22%,transparent 75%)}.cover-copy{position:absolute;bottom:30px;left:30px;right:25px}.cover h2{font:500 40px Georgia,serif;margin:15px 0}.subtitle{line-height:1.6;font-size:15px}.cta{display:inline-flex;gap:12px;margin-top:20px;padding:13px 17px;border:1px solid #92d9ae;background:#12664f;border-radius:12px}footer{padding:14px 20px;font-size:11px;line-height:1.6;color:#bcd1c6;background:#09262e}@keyframes openBook{from{opacity:.3;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}@media(max-width:450px){body{padding:5px}.scene{border-radius:15px}header{padding:14px 12px;font-size:10px;gap:6px}.topline{padding:8px 10px;gap:7px}.back{font-size:11px;padding:7px 10px}.counter{font-size:11px}.leaf{width:39%;height:13%;}.l1,.l3{left:4.5%}.l2,.l4{right:4.5%}.l1,.l2{top:16.7%}.l3,.l4{top:41.1%}.leaf strong{font-size:12px;padding:4px 5px}.leaf small{font-size:10px;padding:3px 6px}.title{top:77.6%;padding:12px 3px}.title h2{font-size:23px}.dialog{padding:19px}.dialog-bar{gap:6px}.close{font-size:12px;padding:8px 10px}h3{font-size:25px}p{font-size:15px}.step{font-size:12px;padding:15px 4px}.steps{gap:4px}.cover{min-height:450px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="scene">
<header><span>TAHİR AI LAB · FIKIH</span><span>KAVRAM KEŞİF KARTLARI</span></header>
<section id="tree-front" hidden><button class="cover cursor-interaction" id="tree-open"><img src="./teklifte-kolaylik-bilgi-agaci-kapak.jpg" class="art tree-asset" alt="Açık bir kitaptan yükselen, ışıklı dalları ve yeşil yaprakları olan bilgi ağacı"><span class="veil"></span><span class="cover-copy"><span class="eyebrow">10. SINIF · KAVRAM KARTI</span><h2>Teklifte kolaylık</h2><span class="subtitle">Her dalda bir bağlantı.<br>Her keşifte yeni bir anlam.</span><br><span class="cta">Bilgi ağacını keşfet <span aria-hidden="true">↗</span></span></span></button></section>
<section id="tree-back"><div class="topline"><button class="back cursor-interaction" id="tree-return">← Kapak kartı</button><span class="counter" id="tree-count">0 / 4 dal keşfedildi</span></div><div class="tree"><img  class="art tree-asset" alt="Dallarında dört etkileşimli öğrenme alanı bulunan bilgi ağacı"><button class="title" id="tree-root-book" aria-label="Teklifte kolaylık kavramını aç"><span class="eyebrow">FIKIH</span><h2>Teklifte kolaylık</h2><small>Kitaplara dokun · Kavramları keşfet</small></button><button class="leaf l1 cursor-interaction" data-branch="meaning" aria-pressed="false"><strong>Kavramın özü</strong><small>Kavramı aç ↗</small></button><button class="leaf l2 cursor-interaction" data-branch="link" aria-pressed="false"><strong>Bağlantıyı kur</strong><small>İlişkiyi keşfet ↗</small></button><button class="leaf l3 cursor-interaction" data-branch="example" aria-pressed="false"><strong>Hayattan bir örnek</strong><small>Örneği aç ↗</small></button><button class="leaf l4 cursor-interaction" data-branch="challenge" aria-pressed="false"><strong>Sen karar ver</strong><small>Soruyu çöz ↗</small></button><div class="trunk-label">Güç yetirme<br>↓<br>Kolaylaştırma</div><div class="overlay" id="tree-overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="tree-dialog-title"><div class="dialog-bar"><span class="eyebrow">DALIN İÇİNE GİR</span><button class="close cursor-interaction" id="tree-dialog-close">Ağaca dön ×</button></div><div id="tree-content" aria-live="polite"></div></section></div></div></section>
<footer>Dallardaki açık kitaplara dokunarak içerikleri keşfedin. · Örnek içerik; MEB ders kitabıyla birebir eşleştirme henüz yapılmamıştır.</footer>
</div>
<script>
document.querySelectorAll(".tree-asset")[1].src=document.querySelector(".tree-asset").src;

(()=>{const root=document.getElementById('bilgi-agaci'),front=root.querySelector('#tree-front'),back=root.querySelector('#tree-back'),overlay=root.querySelector('#tree-overlay'),content=root.querySelector('#tree-content'),close=root.querySelector('#tree-dialog-close');let current=null;const seen=new Set();const data={meaning:{title:'Kolaylığın kökünde ne var?',text:'Teklif, dinî emir ve yasaklarla yükümlü tutulmadır. Teklifte kolaylık, yükümlülüklerde insanın gücünün ve içinde bulunduğu şartların gözetilmesini ifade eder.',steps:['Yükümlülük','Güç yetirme','Kolaylık']},link:{title:'Azimetten ruhsata bir bağlantı',text:'Azimet normal şartlarda geçerli olan asıl hükümdür. Ruhsat, bir mazeret sebebiyle tanınan kolaylıktır. Bu bağlantı, teklifte kolaylık ilkesini anlamamıza yardımcı olur.',steps:['Asıl hüküm','Mazeret','Ruhsat']},example:{title:'Hastalık durumunda oruç',text:'Hastalık sebebiyle Ramazan orucunu tutamayan kişi için, şartlarına göre daha sonra kaza etme kolaylığı bulunur. Kişinin durumu gözetilir.',steps:['Hastalık','Erteleme','Daha sonra kaza']},challenge:{title:'Bu dalda karar senin',text:'Su kullanması sağlığına zarar veren bir kişi, gerekli şartlar oluştuğunda teyemmüm eder. Bu örnek en doğrudan neyi gösterir?',steps:['Durumu incele','İlkeyi bul','Karar ver']}};root.querySelector('#tree-root-book').onclick=()=>root.querySelector('[data-branch=meaning]').click();root.querySelector('#tree-open').onclick=()=>{front.hidden=true;back.hidden=false;root.querySelector('[data-branch]').focus()};root.querySelector('#tree-return').onclick=()=>{back.hidden=true;front.hidden=false;root.querySelector('#tree-open').focus()};function dismiss(){overlay.hidden=true;document.body.style.overflow='';if(current)current.focus()}close.onclick=dismiss;overlay.addEventListener('click',e=>{if(e.target===overlay)dismiss()});root.querySelectorAll('[data-branch]').forEach(b=>b.onclick=()=>{current=b;const key=b.dataset.branch,d=data[key];seen.add(key);root.querySelector('#tree-count').textContent=seen.size+' / 4 dal keşfedildi';root.querySelectorAll('[data-branch]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));content.innerHTML='<h3 id="tree-dialog-title">'+d.title+'</h3><div class="steps">'+d.steps.map((s,i)=>(i?'<span class="arrow" aria-hidden="true">→</span>':'')+'<div class="step">'+s+'</div>').join('')+'</div><p>'+d.text+'</p>'+(key==='challenge'?'<div class="answers"><button class="answer cursor-interaction" data-choice="yes">Şartlara göre kolaylık tanınmasını</button><button class="answer cursor-interaction" data-choice="no">Bütün yükümlülüklerin kalkmasını</button></div><div class="result" aria-live="polite"></div>':'');content.querySelectorAll('[data-choice]').forEach(a=>a.onclick=()=>{content.querySelector('.result').textContent=a.dataset.choice==='yes'?'✓ Doğru. İbadetin yerine getirilmesi için şartlara uygun kolaylık tanınır.':'Yeniden düşün: İbadet terk edilmiyor; şartlara uygun bir kolaylık uygulanıyor.'});overlay.hidden=false;document.body.style.overflow='hidden';close.focus()});root.addEventListener('keydown',e=>{if(overlay.hidden)return;if(e.key==='Escape')dismiss();if(e.key==='Tab'){const els=[...overlay.querySelectorAll('button')],first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});})();
</script>
</div>

</body></html>
