const topics=[
['Doğuş ve İlk Topluluklar','Tarih',65,67,'Hristiyanlığın kökeni, Hz. İsa ve ilk cemaatler','Hristiyanlık, miladi birinci yüzyılda Roma yönetimindeki Filistin bölgesinin Yahudi dinî ve toplumsal ortamında ortaya çıktı. İlk takipçilerinin çoğu Yahudi kökenliydi. Hareket, zaman içinde Yahudi olmayan topluluklara da yayıldı.', ['Birinci yüzyıl Filistin’inde farklı Yahudi dinî toplulukları ve Roma yönetimi bulunuyordu.','Hz. İsa’nın hayatı ve öğretileri Hristiyanlığın merkezindedir; onun kimliğine dair Hristiyan ve İslamî inanç açıklamaları birbirinden ayrılır.','Havariler, ilk cemaatlerin öğreti ve yayılışında önemli görev üstlendi.','Antakya, ilk Hristiyan toplulukların gelişiminde ve “Hristiyan” adlandırmasının tarihinde önemli bir merkezdir.'],'Bir dinî hareketin farklı kültürel çevrelere yayılması, dilini ve örgütlenmesini nasıl etkileyebilir?'],
['Pavlus ve Misyon','Tarih',66,67,'Yayılma süreci ve Yahudi olmayan topluluklar','Tarsuslu Pavlus, Hristiyanlığın Akdeniz coğrafyasındaki yayılışında etkili olan erken dönem isimlerindendir. Mektupları, Yeni Ahit külliyatının önemli bir bölümünü oluşturur. Yahudi kökenli ilk Hristiyanlarla Yahudi olmayan yeni mensuplar arasındaki ilişki erken dönem tartışmalarındandır.',['Yahudi-Hristiyan çevreler, Yahudi gelenekleriyle daha güçlü süreklilik içindeydi.','Gentile terimi, Yahudi olmayan kişileri ifade eder.','Pavlus’un misyon seyahatleri ve cemaatlere gönderdiği mektuplar erken Hristiyanlık için önemlidir.','Misyonerlik, dinî inancın başkalarına duyurulmasına yönelik faaliyetleri anlatır.'],'Bir inancın farklı coğrafyalara ulaşması hangi iletişim yollarını gerektirir?'],
['Hristiyanlık Tarihinde Dönüm Noktaları','Tarih',68,68,'Roma döneminden Reform’a uzanan çizgi','Hristiyanlığın tarihi, Roma İmparatorluğu ile ilişkiler, konsiller, kiliseler arası ayrışmalar ve Reform gibi farklı dönemleri içerir. Siyasi, kültürel ve teolojik gelişmeler birbirinden ayırt edilerek incelenmelidir.',['313 tarihli Milano Fermanı, Hristiyanlara yönelik dinî hoşgörü bağlamında önemli bir dönüm noktasıdır.','325 İznik Konsili, erken dönem öğreti tartışmaları açısından belirleyicidir.','1054, Doğu ve Batı kiliseleri arasındaki ayrışmayı simgeleyen bir tarihtir; ayrışma uzun bir sürece yayılır.','16. yüzyıl Reform hareketleri, Batı Hristiyanlığında yeni kilise geleneklerinin gelişmesine yol açtı.'],'Tarihte tek bir olayın uzun bir ayrışma sürecini simgelemesi ne anlama gelir?'],
['Teslis ve Tanrı Anlayışı','İnanç',69,71,'Baba, Oğul ve Kutsal Ruh öğretisi','Teslis, birçok ana akım Hristiyan kilisesinin Tanrı anlayışının temelidir. Hristiyan teolojisinde Baba, Oğul ve Kutsal Ruh üç ayrı tanrı değil, tek Tanrı’nın üç kişisi olarak açıklanır. İslam inancındaki tevhid anlayışı farklıdır.',['Teslis öğretisinde birlik ve üçlü kişilik birlikte ifade edilir.','Hristiyan inancında İsa Mesih’in kimliği ve kurtarıcı rolü temel konulardandır.','İslam inancında Allah’ın birliği vurgulanır ve Hz. İsa Allah’ın peygamberi olarak kabul edilir.','Teolojik ifadeler ilgili inanç geleneğine atfedilerek aktarılmalıdır.'],'Farklı dinlerin kendi kavramlarını, dışarıdan anlam yüklemeden öğrenmek neden önemlidir?'],
['Asli Günah, Kurtuluş ve Kefaret','İnanç',70,71,'İnsan, günah ve kurtuluş yaklaşımları','Batı Hristiyan teolojisinde asli günah öğretisi, insanlığın düşüşüyle ilişkilendirilir. Çarmıh, kefaret ve diriliş inancı birçok Hristiyan gelenekte kurtuluş anlayışıyla bağlantılıdır. Ayrıntılar mezhepler arasında değişebilir. İslam inancında kalıtsal asli günah öğretisi benimsenmez.',['Çarmıha gerilme ve diriliş Hristiyan inancının temel anlatıları arasındadır.','Kurtuluş kavramının açıklanışında iman, lütuf ve amellerin ilişkisine dair farklı mezhep vurguları bulunur.','İslamî yaklaşımda bireysel sorumluluk ve tövbe anlayışı öne çıkar.'],'Kurtuluş kavramı farklı dinî geleneklerde neden farklı biçimlerde açıklanabilir?'],
['Kitab-ı Mukaddes ve Bölümleri','Metinler',69,70,'Eski Ahit, Yeni Ahit ve kanon','Hristiyan kutsal kitabı Kitab-ı Mukaddes, Eski Ahit ve Yeni Ahit olmak üzere iki ana bölümden oluşur. Yeni Ahit, dört kanonik İncil, Elçilerin İşleri, mektuplar ve Vahiy kitabını içerir; toplam 27 kitaptır. Eski Ahit kitaplarının kapsamı bazı kilise geleneklerinde farklılık gösterir.',['Dört kanonik İncil: Matta, Markos, Luka ve Yuhanna.','Elçilerin İşleri, erken cemaatlerin faaliyetlerini anlatır.','Mektuplar, erken Hristiyan toplulukları ve öğretileri açısından önemlidir.','Katolik ve Protestan Eski Ahit kanonlarının kitap sayısı farklıdır: genellikle sırasıyla 46 ve 39.','İslam inancındaki Hz. İsa’ya vahyedilen İncil anlayışı, Hristiyanlığın dört İncil metni anlayışından farklıdır.'],'Bir kutsal metin külliyatını oluşturan farklı edebî türleri ayırt etmek niçin önemlidir?'],
['Katoliklik','Mezhepler',72,73,'Papaya bağlı kilise geleneği','Katolik Kilisesi, Roma piskoposu olan papanın özel otoritesini kabul eden, dünya çapında örgütlü büyük bir Hristiyan geleneğidir. Kutsal Kitap, gelenek ve kilisenin öğretim yetkisi birlikte değerlendirilir.',['Papa, Katolik Kilisesi’nin görünür birliğinde önemli bir liderlik konumuna sahiptir.','Katolik gelenekte yedi sakrament kabul edilir.','Ayin yaşamında Evharist merkezi önem taşır.'],'Dinî liderlik ve gelenek, büyük bir topluluğun sürekliliğini nasıl etkiler?'],
['Ortodoksluk','Mezhepler',72,74,'Doğu kiliseleri ve patriklik','Ortodoks Hristiyanlığı, özellikle Doğu Hristiyanlığı içinde gelişen kilise geleneklerini ifade eder. Birçok yerel kilisenin kendi yönetim yapısı bulunur. Ekümenik patrik onursal önceliğe sahiptir; Katolik papalık anlayışıyla aynı yetkilere sahip değildir.',['Litürji ve ikon geleneği önemli yer tutar.','1054 ayrışması, Doğu ve Batı kiliselerinin farklılaşmasının simgesidir.','Filioque ifadesi, tarihsel teolojik görüş ayrılıkları arasındadır.'],'Merkezi ve yerel dinî yönetim modelleri nasıl karşılaştırılır?'],
['Protestanlık ve Reform','Mezhepler',73,74,'Luther, Reform ve yeni kilise gelenekleri','16. yüzyılda başlayan Reform hareketleri, Batı Hristiyanlığı içinde Protestan geleneklerinin oluşmasına öncülük etti. Martin Luther öne çıkan isimlerden biridir. Protestanlık tek bir kilise değildir; ibadet ve örgütlenme biçimleri değişiklik gösterir.',['Kutsal Kitap otoritesine güçlü vurgu yapılır.','Lutherci Reform bağlamında sola scriptura, sola fide ve sola gratia ilkeleri sıklıkla anılır.','Birçok Protestan gelenekte vaftiz ve Rabbin Sofrası temel ritüeller arasındadır.','Evanjelik hareketler, Protestan dünya içindeki çeşitli akımlarla ilişkilidir.'],'Bir reform hareketi zaman içinde neden farklı kurumlara ayrılabilir?'],
['Kilise ve Mimari','İbadet',74,75,'İbadet mekânının bölümleri ve işlevleri','Kilise sözcüğü hem Hristiyan topluluğunu hem de onun ibadet binasını ifade edebilir. Katedral, bir piskoposluk merkezindeki kilisedir; şapel daha küçük veya özel amaçlı ibadet mekânıdır. Mimari düzen geleneklere göre değişir.',['Altar: Ayinin merkezindeki kutsal masa veya sunak.','Nef: Kilise ana iç mekânı, cemaatin bulunduğu bölüm.','Narteks: Giriş bölümü.','Kürsü/ambon: Dinî metin okuma ya da vaaz için kullanılan yer.'],'Mimari mekânların işlevleri, ibadet düzenini nasıl yansıtır?'],
['İbadet ve Dinî Takvim','İbadet',74,76,'Pazar ibadeti ve yıllık kutlamalar','Birçok Hristiyan gelenekte pazar günü toplu ibadet önemlidir. Noel, İsa Mesih’in doğumunun kutlanmasıyla; Paskalya, diriliş inancıyla; Pentekost, Kutsal Ruh’un gelişiyle ilişkilendirilir. Büyük Perhiz (Lent), Paskalya öncesi hazırlık dönemidir.',['Noel ile miladi yılbaşı aynı kutlama değildir.','Noel tarihi ve ibadet takvimi kilise gelenekleri arasında farklılaşabilir.','Paskalya tarihleri kullanılan takvime göre değişebilir.'],'Dinî bayram ile takvim yılı başlangıcını ayırmak niçin önemlidir?'],
['Sakramentler','İbadet',75,76,'Dinî ritüeller ve farklı kabuller','Katolik gelenekte yedi sakrament sayılır: vaftiz, konfirmasyon, Evharist, tövbe/itiraf, hastaların yağlanması, ruhbanlık takdisi ve evlilik. Ortodoks gelenek de kutsal sırlar vurgusuyla bu uygulamalara yer verir. Protestan geleneklerde sakrament sayısı ve yorumu farklı olabilir.',['Vaftiz, Hristiyan topluluğuna girişle ilişkilidir.','Evharist, İsa’nın son akşam yemeği anısıyla ilişkilidir.','Konfirmasyon, inancı pekiştirmeye yönelik ritüeldir.','İtiraf, tövbe ve bağışlanma bağlamında ele alınır.'],'Bir ritüelin farklı kiliselerde farklı teolojik açıklamalar kazanması neyi gösterir?'],
['Semboller','Kültür',76,76,'Haç, güvercin, balık ve kuzu','Hristiyanlığın görsel sembolleri, inanç ve kutsal anlatıların hatırlanmasına yardımcı olur. Haç çarmıha gerilme ve kurtuluşla, güvercin Kutsal Ruh’la, balık (Ichthys) İsa Mesih’le, kuzu ise Mesih’in fedakârlığıyla ilişkilendirilir.',['Semboller görsel iletişim araçlarıdır.','Aynı sembolün farklı tarihî sanatsal yorumları bulunabilir.'],'Bir sembol, uzun bir anlatıyı nasıl kısa bir işaretle aktarabilir?'],
['Kutsal Mekânlar','Kültür',77,77,'Hristiyanlık tarihinde önemli yerler','Hristiyanlıkla ilişkili kutsal ve tarihî mekânlar Filistin, Ürdün, İtalya ve Anadolu gibi bölgelerde yer alır. Bu yerler, Hz. İsa, havariler, ilk cemaatler ve hac/ziyaret gelenekleriyle ilişkilidir.',['Beytüllahim, İsa’nın doğum geleneğiyle bağlantılıdır.','Ürdün Nehri kıyısındaki El-Mağtas, vaftiz geleneğiyle ilişkilendirilir.','Kutsal Kabir Kilisesi Kudüs’tedir.','Aziz Petrus Bazilikası Vatikan’dadır.','Meryem Ana Evi ve Aziz Pavlus Kuyusu Türkiye’de bulunan ziyaret yerlerindendir.'],'Bir mekânın dinî hafızada önem kazanmasında hangi unsurlar rol oynar?']
];

 {title:'Pavlus’un Üç Misyon Yolculuğu',category:'Misyon',page:'67',ref:'Harita 3.3',src:'./assets/gorsel-6.svg',summary:'Kitabın Pavlus için verdiği üç misyon yolculuğunun yönleri ve Akdeniz çevresindeki yerleşim alanları haritada gösterilir.',topics:[['Tarsuslu Pavlus','Kitap Gentile Hristiyanlığının önde gelen ismi olarak Tarsuslu Pavlus’u ele alır.','s. 66–67'],['Misyonerlik','Kitap misyonerliği Hristiyanlığın yayılması için yapılan faaliyetler olarak tanımlar.','s. 67']]},

const SOURCE_LOCATIONS=[
 ['Antakya','İlk Adlandırma','Kitabın bilgi kutusuna göre Hristiyanlık adı burada ilk kez kullanılmıştır.','66'],
 ['Tarsus','Pavlus','Kitapta Gentile Hristiyanlığının başını çeken isim Tarsuslu Pavlus olarak geçer.','66–67'],
 ['İznik','Konsil','325 yılında gerçekleşen İznik Konsili ele alınır.','68'],

 ['Beytüllahim','Kutsal Mekân','Hristiyanlarca Hz. İsa’nın doğumuyla ilişkilendirilen mekândır.','77'],
 ['El-Mağtas / Ürdün Nehri','Kutsal Mekân','Hz. İsa’nın vaftiz edildiğine inanılan yer olarak tanıtılır.','77'],
 ['Kudüs / Kıyamet Kilisesi','Kutsal Mekân','Hz. İsa’nın çarmıha gerilmesi, gömülmesi ve dirilişi hakkındaki Hristiyan inançlarıyla ilişkilendirilir.','77'],
 ['Selçuk / Meryem Ana Kilisesi','Ziyaret Yeri','Hz. Meryem’in anısına yapılmış ziyaret mekânı olarak açıklanır.','77'],

];
let sourceMapIndex=0;
function atlasView(){const a=SOURCE_MAPS[sourceMapIndex]||SOURCE_MAPS[0];return `${heading('Harita Atlası','Dinler Tarihi kitabınızın 65, 67 ve 77. sayfalarındaki haritalar ve mekânlar.',`<span class="tag">Kaynak: HRİSTİYANLIK(2).pdf</span>`)}
<section class="atlas-fixed-intro"><div><span class="eyebrow">KİTAPTAN DİJİTAL ATLASA</span><h2>Hristiyanlığın Coğrafi İzleri</h2><p>Üç özgün haritayı seçerek inceleyin. Alt bölümde kitapta açıklanan tarihî merkezler ve kutsal mekânların kaynak sayfalarını keşfedin.</p></div><div class="atlas-count"><strong>3</strong><span>Kitap haritası</span></div></section>
<div class="atlas-fixed-tabs">${SOURCE_MAPS.map((m,i)=>`<button type="button" data-source-map="${i}" class="${sourceMapIndex===i?'active':''}"><span>${String(i+1).padStart(2,'0')}</span>${esc(m.title)}</button>`).join('')}</div>
<div class="atlas-source-layout"><section class="atlas-source-image-panel"><div class="atlas-source-image-head"><div><span class="chip">${esc(a.ref)} · Sayfa ${esc(a.page)}</span><h3>${esc(a.title)}</h3></div><button class="btn soft small" type="button" data-action="atlasExpand">Büyük Görüntüle ⤢</button></div><img class="atlas-original-map" src="${a.src}" alt="${esc(a.title)} - Dinler Tarihi ders kitabındaki özgün harita"/><p class="atlas-source-caption">${esc(a.summary)} <b>Kaynak: Dinler Tarihi, s. ${esc(a.page)}, ${esc(a.ref)}.</b></p></section><aside class="atlas-source-explain"><span class="chip">HARİTA REHBERİ</span><h3>Haritada Neyi Öğreniyoruz?</h3>${a.topics.map((x,i)=>`<article class="atlas-tip"><div class="atlas-tip-num">${i+1}</div><div><b>${esc(x[0])}</b><p>${esc(x[1])}</p><small>Kitap s. ${esc(x[2])}</small></div></article>`).join('')}<div class="atlas-source-note">Bu bölümde kullanılan üç harita doğrudan yüklediğiniz ders kitabından alınmıştır. Görseller temsili değildir.</div></aside></div>
<div class="section-title"><h2>Kaynakta Geçen Mekânlar</h2><p>Bilgi kartına tıklayarak ayrıntıyı görüntüleyin.</p></div><div class="atlas-location-grid">${SOURCE_LOCATIONS.map((l,i)=>`<button type="button" class="atlas-location-card" data-atlas-location="${i}"><span class="atlas-location-index">${String(i+1).padStart(2,'0')}</span><span class="chip">${esc(l[1])}</span><h3>${esc(l[0])}</h3><p>${esc(l[2])}</p><small>Kitap s. ${esc(l[3])}</small><span class="atlas-location-more">Ayrıntıyı aç →</span></button>`).join('')}</div>`}
function render(){side();renderTopbar();document.getElementById('view').innerHTML=state.route==='home'?home():state.route==='lessons'?lessonIndex():state.route==='lesson'?lessonDetail():state.route==='scripture'?scriptureView():state.route==='concepts'?conceptsView():state.route==='compare'?compareView():state.route==='quiz'?activeQuiz():state.route==='resources'?resourcesView():state.route==='timeline'?timelineView():state.route==='atlas'?atlasView():home();if(state.modal)renderModal()}
function go(r){if(!['home','lessons','lesson','scripture','concepts','compare','quiz','resources','timeline','atlas'].includes(r))r='home';state.route=r;state.drawer=false;state.search='';render();window.scrollTo({top:0,behavior:'smooth'})}
function toast(msg){const e=document.getElementById('toastRoot');e.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>e.innerHTML='',2800)}
function modal(title,body){state.modal={title,body};renderModal()}
function renderModal(){const m=state.modal;document.getElementById('modalRoot').innerHTML=m?`<div class="modal-backdrop" data-action="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(m.title)}"><div class="modal-head"><h2>${esc(m.title)}</h2><button class="icon-btn" data-action="closeModal" aria-label="Pencereyi kapat">${ico('close')}</button></div>${m.body}</div></div>`:'';if(m)document.querySelector('.modal [data-action="closeModal"]')?.focus()}
function openScripture(id){const s=scripture.find(x=>x.id===id);if(!s)return;modal(s.title,`<span class="eyebrow">KUTSAL METİN · ${esc(s.category)}</span><h3 class="serif" style="font-size:25px">${esc(s.ref)}</h3><div class="lesson-block"><b>Pasaj Özeti</b><p>${esc(s.summary)}</p><small>Bu bölüm doğrudan ayet alıntısı değildir.</small></div><h3>Anlam ve Açıklama</h3><p>Bu referans, <b>${esc(s.category)}</b> konusuna ilişkin tarihsel veya inançsal bir tartışmayı incelemek için kullanılır. Tam metin için doğrulanmış kutsal kitap baskısına başvurulmalıdır.</p><h3>Sınıfta Tartış</h3><p>Metnin bağlamı, anlatım türü ve ele alınan konu arasında nasıl ilişki kurulabilir?</p><button class="btn soft" data-fav="${s.id}">☆ Favorilere Ekle</button>`)}
function searchResults(val){state.search=val;const wrap=document.querySelector('.search-wrap');wrap?.querySelector('.search-results')?.remove();if(!val.trim())return;const q=slug(val.trim());let all=[...lessons.map(x=>({type:'Ders',title:x.title,details:x.intro,action:`data-open-lesson="${x.id}"`})),...concepts.map(x=>({type:'Kavram',title:x.title,details:x.definition,action:`data-concept-id="${x.id}"`})),...scripture.map(x=>({type:'Metin',title:x.ref+' · '+x.title,details:x.summary,action:`data-scripture="${x.id}"`})),...comparisons.map((x,i)=>({type:'Karşılaştırma',title:x.a+' / '+x.b,details:x.difference,action:`data-comparison="${i}"`})),...questions.map(x=>({type:'Soru',title:x.question,details:x.category,action:'data-route="quiz"'})),...atlasPlaces.map(x=>({type:'Mekân',title:x.title,details:x.region+' '+x.summary,action:'data-route="atlas"'}))].filter(x=>slug(x.title+' '+x.details).includes(q)).slice(0,12);const el=document.createElement('div');el.className='search-results';el.innerHTML=all.length?all.map(x=>`<button class="search-item" ${x.action}><b>${esc(x.title)}</b><small>${esc(x.type)}</small></button>`).join(''):'<div class="empty">Aramanızla eşleşen içerik bulunamadı.</div>';wrap?.append(el)}
function startQuiz(){const mode=document.getElementById('qmode').value,category=document.getElementById('qcategory').value,difficulty=document.getElementById('qdifficulty').value,count=+document.getElementById('qcount').value;const filtered=questions.filter(x=>(category==='Tümü'||x.category===category)&&(difficulty==='Tümü'||x.difficulty===difficulty));let items=[...filtered].sort(()=>Math.random()-.5).slice(0,count);if(!items.length){toast('Bu filtrede soru bulunamadı.');return}let groups=document.getElementById('groupnames')?.value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,6)||[];if(mode==='group'&&groups.length<2){toast('En az iki grup adı girin.');return}state.quiz={mode,items,idx:0,selected:null,answers:[],score:0,groups,scores:groups.map(()=>0)};render()}
function quizAnswer(i){const s=state.quiz;if(!s||s.selected!==null)return;s.selected=i;const q=s.items[s.idx],ok=i===q.correctIndex;s.answers.push({q,correct:ok});if(ok){s.score++;if(s.mode==='group')s.scores[s.idx%s.groups.length]++}render()}
function conceptShift(step){const cs=conceptList();if(!cs.length)return;state.concept=(state.concept+step+cs.length)%cs.length;state.flipped=false;render()}
function favorite(id){const i=state.favorites.indexOf(id);if(i<0)state.favorites.push(id);else state.favorites.splice(i,1);persist();toast(i<0?'Favorilere kaydedildi.':'Favorilerden çıkarıldı.');render()}
function action(a){switch(a){case'drawer':state.drawer=!state.drawer;render();break;case'closeDrawer':state.drawer=false;render();break;case'profile':modal('Öğretmen Profili',`<p>Bu profil bir gösterim profilidir; gerçek oturum açma özelliği yoktur.</p><label class="field-label">Görüntülenen ad<input class="field" id="profileName" maxlength="40" value="${esc(state.profile)}"></label><button class="btn" data-action="saveProfile">Kaydet</button>`);break;case'saveProfile':state.profile=document.getElementById('profileName').value.trim()||'Öğretmen';persist();state.modal=null;render();break;case'atlasExpand':{const a=SOURCE_MAPS[sourceMapIndex];modal(a.title,'<img style="width:100%;height:auto;border-radius:12px" src="'+a.src+'" alt="Kaynak harita"><p>'+esc(a.ref)+' · Ders kitabı sayfa '+esc(a.page)+'</p>');break;}case'notifications':modal('Bildirimler',`<p>Öğrenme durumunuz: <b>${state.completed.length}</b> ders tamamlandı, <b>${state.known.length}</b> kavram öğrenildi.</p><p>Etkinlikleriniz bu tarayıcıya kaydedilir.</p>`);break;case'intro':modal('Atölyeyi Tanıyın',`<div class="eyebrow">ETKİLEŞİMLİ TANITIM</div><p><b>1. Öğrenin:</b> Tarih, inanç, metinler ve mezhepler hakkında yapılandırılmış dersler.</p><p><b>2. Keşfedin:</b> Kutsal metin referansları, mimari şema, kronoloji ve kavram kartları.</p><p><b>3. Karşılaştırın:</b> Kaynaklara saygılı biçimde benzerlik ve farklılıkları görün.</p><p><b>4. Ölçün:</b> Bireysel veya takım yarışmalarıyla bilgilerinizi pekiştirin.</p><button class="btn" data-action="start">İlk Derse Geç ${ico('arrow')}</button>`);break;case'start':state.modal=null;state.lesson=0;go('lesson');break;case'featuredPrev':state.featured=(state.featured+3)%4;render();break;case'featuredNext':state.featured=(state.featured+1)%4;render();break;case'miniConceptPrev':state.miniConcept=(state.miniConcept+concepts.length-1)%concepts.length;render();break;case'miniConceptNext':state.miniConcept++;render();break;case'lessonPrev':state.lesson=Math.max(0,state.lesson-1);render();window.scrollTo(0,0);break;case'lessonNext':state.lesson=Math.min(lessons.length-1,state.lesson+1);render();window.scrollTo(0,0);break;case'complete':{const id=lessons[state.lesson].id;if(!state.completed.includes(id))state.completed.push(id);else state.completed=state.completed.filter(x=>x!==id);persist();toast('Ders ilerlemesi güncellendi.');render();break}case'flip':state.flipped=!state.flipped;render();break;case'conceptPrev':conceptShift(-1);break;case'conceptNext':conceptShift(1);break;case'shuffle':state.concept=Math.floor(Math.random()*conceptList().length);state.flipped=false;render();break;case'toggleReview':state.reviewOnly=!state.reviewOnly;state.concept=0;state.flipped=false;render();break;case'known':case'review':{const c=conceptList()[state.concept];if(!c)return;state.known=state.known.filter(x=>x!==c.id);state.review=state.review.filter(x=>x!==c.id);(a==='known'?state.known:state.review).push(c.id);persist();toast(a==='known'?'Öğrenildi olarak işaretlendi.':'Tekrar listesine eklendi.');if(state.reviewOnly&&a==='known')state.concept=0;else state.concept=(state.concept+1)%Math.max(1,conceptList().length);state.flipped=false;render();break}case'startQuiz':startQuiz();break;case'quizNext':state.quiz.idx++;state.quiz.selected=null;render();break;case'quizQuit':state.quiz=null;render();break;case'quizRestart':state.quiz=null;render();break;case'retryWrong':{const wrong=state.quiz.answers.filter(a=>!a.correct).map(a=>a.q);const old=state.quiz;state.quiz={...old,items:wrong,idx:0,selected:null,answers:[],score:0,scores:old.groups.map(()=>0)};render();break}case'makePlan':makePlan();break;case'print':window.print();break;case'closeModal':state.modal=null;renderModal();break;}}
document.addEventListener('click',function(e){const b=e.target.closest('[data-source-map],[data-atlas-location]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();if(b.dataset.sourceMap!==undefined){sourceMapIndex=Number(b.dataset.sourceMap);render();}else{const l=SOURCE_LOCATIONS[Number(b.dataset.atlasLocation)];if(l)modal(l[0],'<div class="atlas-modal-text"><span class="chip">'+esc(l[1])+'</span><p>'+esc(l[2])+'</p><p><b>Kaynak:</b> HRİSTİYANLIK(2).pdf, ders kitabı s. '+esc(l[3])+'</p></div>');}},true);
document.addEventListener('click',e=>{if(e.target.closest('.modal')&&e.target.classList.contains('modal-backdrop'))return;const b=e.target.closest('[data-route],[data-action],[data-open-lesson],[data-scripture],[data-fav],[data-comparison],[data-concept-filter],[data-atlas-filter],[data-concept-id],[data-mini-answer],[data-quiz-answer],[data-class-delete],[data-info]');if(!b)return;if(b.dataset.route){state.modal=null;go(b.dataset.route)}else if(b.dataset.openLesson){state.lesson=lessons.findIndex(x=>x.id===b.dataset.openLesson);state.modal=null;go('lesson')}else if(b.dataset.scripture)openScripture(b.dataset.scripture);else if(b.dataset.fav)favorite(b.dataset.fav);else if(b.dataset.comparison!==undefined){state.comparison=Number(b.dataset.comparison);go('compare')}else if(b.dataset.conceptFilter){state.conceptFilter=b.dataset.conceptFilter;state.concept=0;state.flipped=false;render()}else if(b.dataset.atlasFilter){state.atlasFilter=b.dataset.atlasFilter;go('atlas')}else if(b.dataset.conceptId){state.conceptFilter='Tümü';state.reviewOnly=false;state.concept=concepts.findIndex(x=>x.id===b.dataset.conceptId);state.flipped=false;go('concepts')}else if(b.dataset.miniAnswer!==undefined){state.miniSelected=Number(b.dataset.miniAnswer);render()}else if(b.dataset.quizAnswer!==undefined)quizAnswer(Number(b.dataset.quizAnswer));else if(b.dataset.classDelete!==undefined){if(confirm('Bu yerel kaydı silmek istiyor musunuz?')){state.classes.splice(Number(b.dataset.classDelete),1);persist();render()}}else if(b.dataset.info)modal(b.dataset.info,`<p>${esc(b.dataset.detail)}</p>`);else if(b.dataset.action)action(b.dataset.action)});
document.addEventListener('input',e=>{if(e.target.id==='globalSearch')searchResults(e.target.value)});document.addEventListener('change',e=>{if(e.target.id==='qmode'){document.getElementById('groupNames').style.display=e.target.value==='group'?'block':'none'}});document.addEventListener('submit',e=>{if(e.target.id==='classForm'){e.preventDefault();let d=new FormData(e.target);state.classes.push({name:String(d.get('name')).trim(),members:String(d.get('members')).trim(),note:String(d.get('note')).trim(),date:new Date().toLocaleDateString('tr-TR')});persist();toast('Grup kaydedildi.');render()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){state.modal=null;state.drawer=false;render();document.querySelector('.search-results')?.remove()}if(e.key==='Enter'&&e.target.id==='flashcard')action('flip')});
try{render()}catch(error){console.error('Uygulama açılış hatası:',error);document.getElementById('view').innerHTML='<section style="padding:24px;background:#fff;border-radius:18px;margin:24px"><h2>Uygulama açılışında bir sorun oluştu</h2><p>Sayfayı yenileyin veya dosyayı Chrome / Edge ile açın.</p></section>'}
</script></body></html>
