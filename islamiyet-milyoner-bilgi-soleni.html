<html lang="tr">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --dark-blue: #020230;
            --medium-blue: #050a5e;
            --accent-blue: #1e2a78;
            --gold: #d4af37;
            --white: #ffffff;
            --correct: #28a745;
            --wrong: #dc3545;
            --selected: #e18c00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle, var(--medium-blue) 0%, var(--dark-blue) 100%);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #game-container {
            width: 95%;
            max-width: 1200px;
            min-height: 600px;
            height: min(88vh,850px);
            display: flex;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--accent-blue);
            border-radius: 24px;
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
            position: relative;
            backdrop-filter: blur(10px);
        }

        #main-area {
            flex: 3;
            display: flex;
            flex-direction: column;
            padding: 40px;
            position: relative;
        }

        #timer-container {
            position: absolute;
            top: 20px;
            right: 40px;
            width: 80px;
            height: 80px;
            border: 4px solid var(--gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            font-weight: bold;
            background: rgba(2, 2, 48, 0.8);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            color: var(--gold);
            transition: all 0.3s ease;
        }

        #sound-toggle {
            position: absolute;
            top: 20px;
            left: 40px;
            background: rgba(2, 2, 48, 0.8);
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: 0.3s;
        }

        #sound-toggle:hover {
            background: var(--gold);
            color: var(--dark-blue);
        }

        #sidebar {
            flex: 0 0 27%;
            min-width: 225px;
            min-height: 0;
            background: rgba(2, 2, 48, 0.9);
            border-left: 2px solid var(--accent-blue);
            display: flex;
            flex-direction: column-reverse;
            padding: 12px 9px;
            gap: 4px;
            border-radius: 0 24px 24px 0;
            overflow: hidden;
        }

        .money-step {
            padding: 3px 12px;
            margin: 0;
            flex: 1 1 0;
            min-height: 0;
            align-items: center;
            white-space: nowrap;
            border-radius: 8px;
            font-weight: 600;
            color: var(--gold);
            font-size: clamp(0.72rem, 1.1vw, 0.93rem);
            display: flex;
            justify-content: space-between;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .money-step.active {
            background: var(--selected);
            color: white;
            transform: none;
            box-shadow: 0 4px 15px rgba(225, 140, 0, 0.4);
            border-color: var(--gold);
        }

        .money-step.checkpoint {
            color: white;
            background: rgba(255,255,255,0.05);
        }

        #joker-container {
            display: flex;
            gap: 20px;
            margin-top: 50px;
            margin-bottom: auto;
        }

        .joker {
            width: 60px;
            height: 40px;
            border: 2px solid var(--gold);
            border-radius: 50% / 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            transition: 0.3s;
            background: rgba(2, 2, 48, 0.8);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .joker:hover:not(.used) {
            background: var(--gold);
            color: var(--dark-blue);
            transform: translateY(-3px);
        }

        .joker.used {
            opacity: 0.2;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        #question-box {
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            padding: 35px;
            text-align: center;
            border-top: 2px solid var(--gold);
            border-bottom: 2px solid var(--gold);
            margin: 30px 0;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            line-height: 1.5;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .option {
            background: linear-gradient(90deg, #050a5e, #1e2a78);
            border: 2px solid var(--gold);
            padding: 18px 25px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 1.1rem;
            position: relative;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
        }

        .option span {
            color: var(--gold);
            margin-right: 15px;
            font-weight: 800;
        }

        .option:hover {
            background: var(--accent-blue);
            border-color: white;
            padding-left: 35px;
        }

        .option.selected { background: var(--selected) !important; color: white; border-color: white; }
        .option.correct { background: var(--correct) !important; color: white; border-color: white; animation: blink 0.5s 3; }
        .option.wrong { background: var(--wrong) !important; color: white; border-color: white; }
        .option.hidden { opacity: 0; pointer-events: none; }

        @keyframes blink {
            50% { opacity: 0.5; }
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 24px;
            text-align: center;
            padding: 40px;
        }

        #start-screen { display: flex; }
        #game-over { display: none; }

        .overlay h2 { font-size: 3rem; color: var(--gold); margin-bottom: 20px; letter-spacing: 2px; }
        .overlay p { font-size: 1.4rem; margin-bottom: 30px; line-height: 1.6; }

        .btn-action {
            padding: 15px 45px;
            font-size: 1.2rem;
            background: var(--gold);
            color: var(--dark-blue);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-action:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px var(--gold);
        }

        #audience-poll {
            display: none;
            flex-direction: row;
            align-items: flex-end;
            gap: 12px;
            height: 100px;
            margin-top: 20px;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 10px;
        }

        .poll-bar {
            width: 35px;
            background: linear-gradient(to top, var(--gold), #fff);
            position: relative;
            border-radius: 4px 4px 0 0;
            transition: height 1s ease-out;
        }

        .poll-label {
            position: absolute;
            bottom: -25px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            font-weight: bold;
        }

        #phone-call-ui {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: var(--gold);
            color: var(--dark-blue);
            padding: 15px;
            border-radius: 15px;
            max-width: 250px;
            display: none;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (min-width: 851px) and (max-height: 650px) {
            #game-container { height: 96vh; }
            #sidebar { gap: 2px; padding: 6px; }
            .money-step { padding-block: 1px; }

            .option { padding: 12px 20px; font-size: 0.95rem; }
            .overlay h2 { font-size: 2rem; }

<script>
    // --- SES SİSTEMİ (Web Audio API) ---
    let audioCtx = null;
    let isSoundMuted = false;
    
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function toggleSound() {
        isSoundMuted = !isSoundMuted;
        document.getElementById('sound-toggle').innerText = isSoundMuted ? "🔇 Ses: Kapalı" : "🔊 Ses: Açık";
    }

    function playTone(freq, type, duration, volume = 0.05) {
        if (isSoundMuted || !audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    const sounds = {
        // Her saniye tok bir tik; son 10 saniyede daha tiz ve belirgin.
        tick: (urgent = false) => {
            playTone(urgent ? 1050 : 680, 'square', urgent ? 0.085 : 0.055, urgent ? 0.033 : 0.020);
        },
        select: () => playTone(440, 'triangle', 0.16, 0.035),
        // Doğru cevap: yükselen üç notalı «tırunt» melodisi.
        correct: () => {
            [523, 659, 880].forEach((note, i) =>
                setTimeout(() => playTone(note, 'sine', i === 2 ? 0.48 : 0.2, 0.065), i * 125));
        },
        // Yanlış cevap: tek, alçalan «tın» uyarısı.
        wrong: () => {
            playTone(260, 'triangle', 0.55, 0.085);
            setTimeout(() => playTone(155, 'sine', 0.46, 0.065), 135);
        },
        win: () => {
            const notes = [523, 659, 783, 1046];
            notes.forEach((n, i) => setTimeout(() => playTone(n, 'square', 0.5, 0.08), i * 150));

    const moneyLadder = [

    // Her yeni yarışmada 10 farklı soru; yakın zamanda kullanılanları sona bırakır.
    const HISTORY_KEY = 'islamiyet-milyoner-siyer-tasarim-soru-gecmisi-v1';
    function shuffled(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
    }
    function buildQuestions() {
        let seen = [];
        try { seen = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch (e) {}
        if (!Array.isArray(seen)) seen = [];
        const seenSet = new Set(seen);
        const unused = shuffled(questionBank.filter(q => !seenSet.has(q.id)));
        const older = shuffled(questionBank.filter(q => seenSet.has(q.id)));
        const picks = [...unused, ...older].slice(0, moneyLadder.length);
        // Kullanılmış havuz sıfırlandığında eski sorulara tekrar yer aç.
        const recent = [...seen, ...picks.map(q => q.id)].slice(-Math.min(38, questionBank.length - 10));
        try { localStorage.setItem(HISTORY_KEY, JSON.stringify(recent)); } catch (e) {}
        return picks.map(question => {
            const variants = shuffled(question.a.map((answer, i) => ({answer, correct: i === question.c})));
            return {...question, a: variants.map(v => v.answer), c: variants.findIndex(v => v.correct)};
        });
    }

    let timerInterval = null;

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 20;
        const timerEl = document.getElementById('timer-container');
        timerEl.innerText = timeLeft;
        timerEl.style.color = "var(--gold)";
        timerEl.style.borderColor = "var(--gold)";

        timerInterval = setInterval(() => {
            if (!isAnswering) {
                timeLeft--;
                timerEl.innerText = timeLeft;
                
                if (timeLeft > 0) sounds.tick(timeLeft <= 10);

                if (timeLeft <= 10) {
                    timerEl.style.color = "var(--wrong)";
                    timerEl.style.borderColor = "var(--wrong)";
                    timerEl.style.transform = "scale(1.1)";
                } else {
                    timerEl.style.transform = "scale(1)";
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    isAnswering = true;
                    sounds.wrong();
                    if(selectedMode==="group"){setTimeout(()=>{if(!document.getElementById("start-screen").offsetParent)advanceGroup()},1200)}else endGame(false, "Süreniz Doldu!");
                }
            }
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
        document.getElementById('timer-container').style.transform = "scale(1)";
    }

    
    let expandedFrame=null,expandedParentScroll=0;
    function nativeFullscreenElement(){return document.fullscreenElement||document.webkitFullscreenElement;}
    function setExpandedGame(active){
        document.documentElement.classList.toggle('game-expanded',active);
        document.body.classList.toggle('game-expanded',active);
        document.getElementById('game-container').classList.toggle('game-expanded',active);
        try{
            const frame=window.frameElement;
            if(frame){
                if(active){expandedFrame=frame;expandedParentScroll=window.parent.scrollY;frame.classList.add('game-frame-expanded');window.parent.document.documentElement.classList.add('game-frame-active');window.parent.document.body.classList.add('game-frame-active');}
                else if(expandedFrame){expandedFrame.classList.remove('game-frame-expanded');window.parent.document.documentElement.classList.remove('game-frame-active');window.parent.document.body.classList.remove('game-frame-active');window.parent.scrollTo(0,expandedParentScroll);expandedFrame=null;}
            }
        }catch(e){}
        syncGameFullscreen();
    }
    async function enterGameFullscreen(){
        const el=document.getElementById('game-container');
        if(!el||nativeFullscreenElement()||el.classList.contains('game-expanded'))return;
        try{
            if(el.requestFullscreen){await el.requestFullscreen();syncGameFullscreen();return;}
            if(el.webkitRequestFullscreen){await el.webkitRequestFullscreen();syncGameFullscreen();return;}
        }catch(e){}
        setExpandedGame(true);
    }
    async function toggleGameFullscreen(){
        try{
            if(nativeFullscreenElement()){
                if(document.exitFullscreen)await document.exitFullscreen();
                else if(document.webkitExitFullscreen)await document.webkitExitFullscreen();
            }else if(document.getElementById('game-container').classList.contains('game-expanded'))setExpandedGame(false);
            else await enterGameFullscreen();
        }catch(e){setExpandedGame(false);}
        syncGameFullscreen();
    }
    function syncGameFullscreen(){
        const active=!!nativeFullscreenElement()||document.getElementById('game-container').classList.contains('game-expanded');
        document.querySelectorAll('#game-fullscreen-toggle,.overlay-fullscreen').forEach(btn=>{
            btn.textContent=active?'⤡ Tam Ekrandan Çık':'⛶ Tam Ekran';
            btn.setAttribute('aria-label',active?'Tam ekrandan çık':'Tam ekrana geç');
            btn.setAttribute('aria-pressed',String(active));
        });
    }
    document.addEventListener('fullscreenchange',syncGameFullscreen);
    document.addEventListener('webkitfullscreenchange',syncGameFullscreen);
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!nativeFullscreenElement())setExpandedGame(false);});

    function initGame() {
        gameSession++;
        initAudio();
        enterGameFullscreen();
        
        currentStep = 0;
        teamScores = [0,0];
        questions = buildQuestions();
        document.getElementById("group-scoreboard").style.display=selectedMode==="group"?"block":"none";
        refreshTeamScores();
        isAnswering = false;
        usedJokers = { half: false, audience: false, phone: false };
        
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-over').style.display = 'none';
        document.getElementById('phone-call-ui').style.display = 'none';
        document.getElementById('audience-poll').style.display = 'none';
        
        document.querySelectorAll('.joker').forEach(j => j.classList.remove('used'));
        
        setupSidebar();
        loadQuestion();
    }

    function refreshTeamScores(){document.getElementById("team-score-a").textContent=teamScores[0];document.getElementById("team-score-b").textContent=teamScores[1];document.getElementById("team-turn").textContent=currentStep%2?"Grup B":"Grup A";}
    function advanceGroup(){currentStep++;if(currentStep>=questions.length){endGroupGame();return;}loadQuestion();document.getElementById("phone-call-ui").style.display="none";document.getElementById("audience-poll").style.display="none";}
    function endGroupGame(){stopTimer();const a=teamScores[0],b=teamScores[1];document.getElementById("game-over").style.display="flex";document.getElementById("result-title").textContent=a===b?"BERABERE!":(a>b?"GRUP A KAZANDI!":"GRUP B KAZANDI!");document.getElementById("result-desc").textContent="Grup A: "+a+" puan • Grup B: "+b+" puan";}
    function setupSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.innerHTML = '';
        moneyLadder.forEach((money, index) => {
            const div = document.createElement('div');
            div.className = 'money-step';
            if (index === 2 || index === 6 || index === 9) div.classList.add('checkpoint');
            div.id = `step-${index}`;
            div.innerHTML = `<span>${index + 1}</span> <span>${money}</span>`;
            sidebar.appendChild(div);
        });
    }

    function loadQuestion() {
        isAnswering = false;
        refreshTeamScores();
        const question = questions[currentStep];
        document.getElementById('question-box').innerText = question.q;
        const options = document.querySelectorAll('.option');
        options.forEach((opt, index) => {
            opt.classList.remove('selected', 'correct', 'wrong', 'hidden');
            opt.querySelector('p').innerText = question.a[index];
        });
        
        document.querySelectorAll('.money-step').forEach(s => s.classList.remove('active'));
        const activeStep = document.getElementById(`step-${currentStep}`);
        if(activeStep) activeStep.classList.add('active');
        
        startTimer();
    }

    function handleAnswer(index) {
        if (isAnswering) return;
        const optionEl = document.getElementById(`opt-${index}`);
        if (optionEl.classList.contains('hidden')) return;

        isAnswering = true;
        stopTimer();
        sounds.select();
        
        const correctIndex = questions[currentStep].c;
        const options = document.querySelectorAll('.option');
        options[index].classList.add('selected');

        const activeSession=gameSession;
        setTimeout(() => {
            if(activeSession!==gameSession)return;
            if (index === correctIndex) {
                if(selectedMode==="group"){teamScores[currentStep%2]+=10;refreshTeamScores();}
                sounds.correct();
                options[index].classList.replace('selected', 'correct');
                
                setTimeout(() => {
                    if(activeSession!==gameSession)return;
                    if(selectedMode==="group"){advanceGroup();} else if (currentStep === questions.length - 1) {
                        sounds.win();
                        endGame(true);
                    } else {
                        currentStep++;
                        loadQuestion();
                        document.getElementById('phone-call-ui').style.display = 'none';
                        document.getElementById('audience-poll').style.display = 'none';
                    }
                }, 2000);
            } else {
                sounds.wrong();
                options[index].classList.replace('selected', 'wrong');
                options[correctIndex].classList.add('correct');
                setTimeout(() => {if(activeSession===gameSession)(selectedMode==="group"?advanceGroup():endGame(false));}, 2000);
            }
        }, 1500);
    }

    function useHalfJoker() {
        if (usedJokers.half || isAnswering) return;
        sounds.joker();
        usedJokers.half = true;
        document.getElementById('joker-50').classList.add('used');
        
        const correct = questions[currentStep].c;
        let indices = [0, 1, 2, 3].filter(i => i !== correct).sort(() => Math.random() - 0.5);
        document.getElementById(`opt-${indices[0]}`).classList.add('hidden');
        document.getElementById(`opt-${indices[1]}`).classList.add('hidden');
    }

    function useAudienceJoker() {
        if (usedJokers.audience || isAnswering) return;
        sounds.joker();
        usedJokers.audience = true;
        document.getElementById('joker-audience').classList.add('used');
        
        const poll = document.getElementById('audience-poll');
        poll.innerHTML = '';
        poll.style.display = 'flex';
        
        const correct = questions[currentStep].c;
        let votes = [0,0,0,0];
        let rem = 100;
        
        votes[correct] = Math.floor(Math.random() * 40) + 50; 
        rem -= votes[correct];
        
        const others = [0,1,2,3].filter(i => i !== correct);
        others.forEach((i, idx) => {
            let v = idx === others.length - 1 ? rem : Math.floor(Math.random() * rem);
            votes[i] = v; rem -= v;
        });

        ['A', 'B', 'C', 'D'].forEach((l, i) => {
            const b = document.createElement('div');
            b.className = 'poll-bar';
            b.style.height = `0%`;
            b.innerHTML = `<div class="poll-label">${l}<br>${votes[i]}%</div>`;
            poll.appendChild(b);
            setTimeout(() => b.style.height = `${votes[i]}%`, 50);
        });
    }

    function usePhoneJoker() {
        if (usedJokers.phone || isAnswering) return;
        sounds.joker();
        usedJokers.phone = true;
        document.getElementById('joker-phone').classList.add('used');

        const phoneUI = document.getElementById('phone-call-ui');
        phoneUI.style.display = 'block';
        phoneUI.innerText = "Aranıyor...";

        const correct = questions[currentStep].c;
        const labels = ['A', 'B', 'C', 'D'];
        
        setTimeout(() => {
            phoneUI.innerHTML = `<strong>Hoca:</strong> <br> "Sanırım doğru cevap ${labels[correct]} şıkkı evladım."`;
        }, 2000);
    }

    function endGame(win, reason = "") {if(selectedMode==="group"){endGroupGame();return;}
        stopTimer();
        const overlay = document.getElementById('game-over');
        overlay.style.display = 'flex';
        const title = document.getElementById('result-title');
        const desc = document.getElementById('result-desc');
        
        if (win) {
            title.innerText = "TEBRİKLER!";
            desc.innerText = "İslamiyet Bilgi Milyoneri Oldunuz! \n Ödül: 1.000.000 TL";
        } else {
            title.innerText = reason ? reason : "ELENDİNİZ";
            let prize = "0 TL";
            if (currentStep >= 7) prize = moneyLadder[6];
            else if (currentStep >= 3) prize = moneyLadder[2];
            desc.innerText = `Güzel bir yarışmaydı. \n Kazanılan Ödül: ${prize}`;
        }
    }
</script>

</body>
