 try{

ht:0;top:0;bottom:0;z-index:110;width:min(88vw,350px);padding:calc(22px + env(safe-area-inset-top)) 18px 24px;overflow-y:auto;background:linear-gradient(155deg,#0d3040,#06141f);color:#f8eddb;box-shadow:-15px 0 55px #000b;transform:translateX(105%);transition:transform .25s ease;box-sizing:border-box}\nbody.m-menu #mobile-menu{transform:translateX(0)}\nbody.m-menu #mobile-shade{display:block}\n#mobile-menu h2{font:600 23px Georgia,serif;color:#efd08c;margin:0 0 6px}\n#mobile-menu p{color:#b9c4bc;font-size:12px;line-height:1.5}\n#mobile-menu button,#mobile-menu select{background:#16413e;color:#f8e8c8;border:1px solid #d6ad6055;border-radius:11px;padding:10px;min-height:42px}\n#mobile-menu .mr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}\n#mobile-menu .mg{border-top:1px solid #d6ad602c;padding-top:10px;margin-top:14px}\n#mobile-menu .mf{display:flex;gap:7px}#mobile-menu .mf>*{flex:1}\n}\n@media(min-width:768px){#mobile-menu-button,#mobile-menu,#mobile-shade{display:none!important}}\n";doc.head.appendChild(style);
  doc.body.insertAdjacentHTML('beforeend',"\n<button id=\"mobile-menu-button\" aria-label=\"Okuma ayarlarını aç\">☰</button><div id=\"mobile-shade\"></div>\n<aside id=\"mobile-menu\" aria-label=\"Mobil kitap ayarları\">\n<div class=\"mr\"><div><h2>Okuma Ayarları</h2><p>Helallerde Genişlik</p></div><button id=\"m-close\" aria-label=\"Kapat\">✕</button></div>\n<div class=\"mg\"><div class=\"mr\"><b>İçindekiler</b><button id=\"m-toc\">Aç</button></div><div class=\"mr\"><b>Yer imi</b><button id=\"m-save\">Kaydet</button></div><button id=\"m-restore\">Kaydedilen sayfaya git</button></div>\n<div class=\"mg\"><div class=\"mr\"><b>Sayfa sesi</b><button id=\"m-sound\">Açık ✓</button></div><div class=\"mr\"><b>Otomatik çevirme</b><button id=\"m-auto\">Kapalı</button></div><div class=\"mr\"><b>Sesli anlatım</b><button id=\"m-read\">Başlat</button></div><p>Cihazdaki Türkçe ses kullanılır. Sesli anlatım, cihazın desteğine bağlıdır.</p></div>\n<div class=\"mg\"><div class=\"mr\"><b>Gece modu</b><button id=\"m-night\">Kapalı</button></div><div class=\"mr\"><label for=\"m-theme\">Kâğıt teması</label><select id=\"m-theme\"><option value=\"#fcf8ee\">Fildişi</option><option value=\"#edf4e9\">Açık zümrüt</option><option value=\"#f5e9d5\">Kum beji</option></select></div><div>Yazı boyutu</div><div class=\"mf\"><button id=\"m-sm\">A−</button><button id=\"m-md\">Normal</button><button id=\"m-lg\">A+</button></div></div>\n<div class=\"mg\"><div class=\"mr\"><b>Geniş okuma</b><button id=\"m-focus\">Aç</button></div><div class=\"mr\"><b>Tam ekran</b><button id=\"m-full\">Dene</button></div><p>Safari desteklemezse geniş okuma görünümü kullanılır.</p></div>\n</aside>\n");
  const sc=doc.createElement('script');sc.textContent="\n(function(){\nconst d=document,b=d.body,$=id=>d.getElementById(id);const toggle=(on)=>b.classList.toggle('m-menu',on);\n$('mobile-menu-button').onclick=()=>toggle(true);$('m-close').onclick=()=>toggle(false);$('mobile-shade').onclick=()=>toggle(false);\n$('m-toc').onclick=()=>{toggle(false);$('btn-toc').click()};\n$('m-sound').onclick=()=>{$('btn-sound').click();$('m-sound').textContent=soundEnabled?'Açık ✓':'Kapalı'};\n$('m-auto').onclick=()=>{$('btn-autoplay').click();$('m-auto').textContent=isAutoPlaying?'Durdur':'Kapalı'};\n$('m-night').onclick=()=>{$('m-night').textContent=b.classList.toggle('m-night')?'Açık':'Kapalı'};\n$('m-theme').onchange=e=>b.style.setProperty('--reader-paper',e.target.value);\nconst font=v=>{b.classList.remove('m-small','m-large');if(v)b.classList.add('m-'+v)};\n$('m-sm').onclick=()=>font('small');$('m-md').onclick=()=>font('');$('m-lg').onclick=()=>font('large');\n$('m-save').onclick=()=>{try{localStorage.setItem('fikih-mobil-yer-imi',pageFlip.getCurrentPageIndex());$('m-save').textContent='Kaydedildi ✓'}catch(e){}};\n$('m-restore').onclick=()=>{let n=Number(localStorage.getItem('fikih-mobil-yer-imi'));if(n>=1&&n<=5)pageFlip.turnToPage(n);toggle(false)};\nconst stop=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();$('m-read').textContent='Başlat'};\n$('m-read').onclick=()=>{if(!('speechSynthesis'in window)){alert('Sesli anlatım desteklenmiyor');return}if(speechSynthesis.speaking){stop();return}let pages=d.querySelectorAll('#book .page'),i=pageFlip.getCurrentPageIndex(),txt=pages[i]?.innerText||'';let u=new SpeechSynthesisUtterance(txt);u.lang='tr-TR';u.rate=.9;u.onend=stop;u.onerror=stop;speechSynthesis.speak(u);$('m-read').textContent='Durdur'};\nwindow.addEventListener('fikih-page-changed',stop);\n$('m-focus').onclick=()=>{const on=b.classList.toggle('m-focus');$('m-focus').textContent=on?'Kapat':'Aç';toggle(false);window.dispatchEvent(new Event('resize'))};\n$('m-full
