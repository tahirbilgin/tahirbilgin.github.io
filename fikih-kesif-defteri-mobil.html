const controls=String.raw`

</aside>
`;
const script=String.raw`<script>
(function(){
const d=document,b=d.body,$=id=>d.getElementById(id);const toggle=(on)=>b.classList.toggle('m-menu',on);
$('mobile-menu-button').onclick=()=>toggle(true);$('m-close').onclick=()=>toggle(false);$('mobile-shade').onclick=()=>toggle(false);
$('m-toc').onclick=()=>{toggle(false);$('btn-toc').click()};
$('m-sound').onclick=()=>{$('btn-sound').click();$('m-sound').textContent=soundEnabled?'Açık ✓':'Kapalı'};
$('m-auto').onclick=()=>{$('btn-autoplay').click();$('m-auto').textContent=isAutoPlaying?'Durdur':'Kapalı'};
$('m-night').onclick=()=>{$('m-night').textContent=b.classList.toggle('m-night')?'Açık':'Kapalı'};
$('m-theme').onchange=e=>b.style.setProperty('--reader-paper',e.target.value);
const font=v=>{b.classList.remove('m-small','m-large');if(v)b.classList.add('m-'+v)};
$('m-sm').onclick=()=>font('small');$('m-md').onclick=()=>font('');$('m-lg').onclick=()=>font('large');
$('m-save').onclick=()=>{try{localStorage.setItem('fikih-mobil-yer-imi',pageFlip.getCurrentPageIndex());$('m-save').textContent='Kaydedildi ✓'}catch(e){}};
$('m-restore').onclick=()=>{let n=Number(localStorage.getItem('fikih-mobil-yer-imi'));if(n>=1&&n<=5)pageFlip.turnToPage(n);toggle(false)};
const stop=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();$('m-read').textContent='Başlat'};
$('m-read').onclick=()=>{if(!('speechSynthesis'in window)){alert('Sesli anlatım desteklenmiyor');return}if(speechSynthesis.speaking){stop();return}let pages=d.querySelectorAll('#book .page'),i=pageFlip.getCurrentPageIndex(),txt=pages[i]?.innerText||'';let u=new SpeechSynthesisUtterance(txt);u.lang='tr-TR';u.rate=.9;u.onend=stop;u.onerror=stop;speechSynthesis.speak(u);$('m-read').textContent='Durdur'};
window.addEventListener('fikih-page-changed',stop);
$('m-focus').onclick=()=>{const on=b.classList.toggle('m-focus');$('m-focus').textContent=on?'Kapat':'Aç';toggle(false);window.dispatchEvent(new Event('resize'))};
$('m-full').onclick=async()=>{toggle(false);try{if(d.fullscreenElement)await d.exitFullscreen();else await d.documentElement.requestFullscreen()}catch(e){b.classList.add('m-focus');window.dispatchEvent(new Event('resize'))}};
})();
</script>;
html=html.replace('</head>',css+'</head>').replace('</body>',controls+script+'</body>');
document.open();document.write(html);document.close();
}catch(e){document.getElementById('loading').textContent='Uygulama yüklenemedi. Lütfen bağlantıyı kontrol edin.';console.error(e)}
})();
</script></body></html>
