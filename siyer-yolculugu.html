function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function home(){const visited=state.visited.length;return `<section class="hero"><div><div class="eyebrow">SİYER ATÖLYESİ / ETKİLEŞİMLİ KEŞİF</div><h1>Bir hayatın<br><em>izini sür.</em></h1><p class="hero-copy">Olayları yalnızca hatırlama; aralarındaki bağı keşfet. Mekke’den Medine’ye uzanan yolculukta kartları aç, zamanı sırala, ipuçlarını birleştir.</p><div class="hero-actions"><button class="primary" data-nav="library">Kartları keşfet ↗</button><button data-nav="settings">Takım oyununu hazırla</button></div></div>${art()}</section><div class="section-line"><h2>Bugün nasıl keşfedelim?</h2><span>4 farklı öğrenme yolu</span></div><section class="mode-grid" aria-label="Oyun türleri">${[['library','cards','Kartları keşfet','24 olayın hikâyesini, yerini ve düşündürdüklerini incele.','OKU & DÜŞÜN'],['order','order','Zamanı sırala','Karışık olayları zaman çizgisine yerleştir.','SIRALA & KONTROL ET'],['guess','clue','Ben hangi olayım?','İpuçlarından gizli olayın adını bul.','TAHMİN ET & KEŞFET'],['chain','route','Önce–sonra','Bir olayın çizelgedeki komşularını bul.','BAĞLANTI KUR']].map(m=>`<button class="mode-card" ${m[0]==='library'?'data-nav="library"':'data-play="'+m[0]+'"'}><span class="mode-icon">${icon(m[1])}</span><h3>${m[2]}</h3><p>${m[3]}</p><span class="mini">${m[4]}</span><span class="arrow">↗</span></button>`).join('')}</section><div class="section-line"><h2>Yolculuğun durakları</h2><span>${visited}/24 kart keşfedildi</span></div><section class="route-grid">${['mekke','hicret','medine'].map((era,i)=>{const all=EVENTS.filter(e=>e.era===era),done=all.filter(e=>state.visited.includes(e.id)).length;return `<button class="route-card" data-era-library="${era}"><span class="index">0${i+1} / ${all.length} KART</span><h3>${ERAS[era]}${era==='hicret'?' yolculuğu':' dönemi'}</h3><p>${done}/${all.length} keşfedildi</p><div class="progress-track"><span style="width:${done/all.length*100}%"></span></div></button>`}).join('')}</section><div class="notice">Tek ekrandan birey function openDetail(id){const e=event(id);if(!e)return;if(!$('detail').open)returnFocus=document.activeElement;detailId=id;if(!state.visited.includes(id)){state.visited.push(id);save();updateProgress()}const prev=EVENTS[e.rank-1],next=EVENTS[e.rank+1];$('detailBody').innerHTML=`<button class="close" data-close="detail" aria-label="Kartı kapat">×</button><div class="detail-art">${icon(e.icon)}<div><small>${ERAS[e.era]} / ${e.date}</small><h2 id="detailTitle">${e.title}</h2><p>${e.place}</p></div></div><div class="eyebrow">NE OLDU?</div><p class="detail-summary">${e.summary}</p><div class="detail-value"><strong>Değer üzerine düşün</strong><br>${e.value}</div><div class="eyebrow">SINIFTA KONUŞALIM</div><p class="detail-question">${e.question}</p><p class="helper">Değer yorumu ve tartışma sorusu eğitim amaçlı hazırlanmıştır. Kart komşuları, keşif defterindeki anlatım sırasını gösterir; bütün olaylar arasında kesin sebep–sonuç veya aynı yıl içinde kesin tarih sırası anlamına gelmez.</p><div class="detail-nav"><button data-detail="${prev?.id||''}" ${!prev?'disabled':''}>‹ Önceki kart</button><button data-detail="${next?.id||''}" ${!next?'disabled':''}>Sonraki kart ›</button></div><a class="detail-source" href="${e.source}" target="_blank" rel="noopener noreferrer">Kaynak: TDV İslâm Ansiklopedisi ↗</a>`;if(!$('detail').open)$('detail').showModal();$('detail').scrollTop=0}
function scores(){if(state.settings.players!=='teams')return '';return '<div class="scoreboard">'+state.teams.map((t,i)=>`<div class="score ${i===state.activeTeam?'current':''}">${i===state.activeTeam?'● ':''}${esc(t.name)}<strong>${t.score}</strong></div>`).join('')+'</div>'}
function orderedPool(){return filtered().filter(e=>e.year!==null).sort((a,b)=>a.year-b.year)}
function combinations(n,k){let r=1;for(let i=1;i<=k;i++)r=r*(n-i+1)/i;return Math.round(r)}
function startGame(mode){stopTimer();const pool=mode==='guess'?filtered():orderedPool();if((mode==='order'&&pool.length<4)||(mode==='chain'&&pool.length<3)||(mode==='guess'&&pool.length<1)){toast('Bu dönem bu oyun için yeterli farklı tarihli kart içermiyor. Öğretmen masasından “Tüm yolculuk” seç.');return}game={mode,round:0,total:Math.min(state.settings.rounds,mode==='guess'?pool.length:mode==='chain'?pool.length-2:combinations(pool.length,Math.min(state.settings.size,pool.length))),points:0,correct:0,deck:shuffle(pool),usedSets:new Set(),finished:false};nextRound(false);navigate('game');startTimer()}
function nextRound(rotate=true){if(!game)return;stopTimer();if(rotate&&state.settings.players==='teams'){state.activeTeam=(state.activeTeam+1)%state.teams.length;save()}if(game.round>=game.total){game.finished=true;render();return}game.round++;game.locked=false;game.hints=1;game.retries=0;game.solution=false;game.feedback='';game.result=null;
if(game.mode==='guess'){game.answer=game.deck.pop();let distractors=shuffle(EVENTS.filter(e=>e.id!==game.answer.id&&e.era===game.answer.era));if(distractors.length<3)distractors=shuffle(EVENTS.filter(e=>e.id!==game.answer.id));game.options=shuffle([game.answer,...distractors.slice(0,3)]);game.clue=1}
if(game.mode==='order'){const pool=orderedPool(),n=Math.min(state.settings.size,pool.length);let list,key,attempt=0;do{list=shuffle(pool).slice(0,n);key=list.map(e=>e.id).sort().join('|')}while(game.usedSets.has(key)&&++attempt<100);game.usedSets.add(key);game.expected=[...list].sort((a,b)=>a.year-b.year);game.order=shuffle(list);if(game.order.every((e,i)=>e.id===game.expected[i].id))game.order.push(game.order.shift());game.hints=0;game.selected=-1}
if(game.mode==='chain'){const pool=orderedPool();if(!game.pivots)game.pivots=shuffle(pool.slice(1,-1));game.pivot=game.pivots.pop();let i=pool.indexOf(game.pivot);game.before=pool[i-1];game.after=pool[i+1];game.chainOptions=shuffle(pool.filter(e=>e.id!==game.pivot.id));game.pickBefore='';game.pickAfter='';game.timeline=pool}
if(view==='game')render();startTimer()}
function startTimer(){stopTimer();if(!game||game.locked||game.finished||!state.settings.timer)return;game.seconds=state.settings.timer;timerHandle=setInterval(()=>{if(view!=='game'||game.locked){stopTimer();return}game.seconds--;const el=$('timer');if(el)el.textContent=game.seconds>0?game.seconds+' sn':'Süre doldu · düşünmeye devam';if(game.seconds<=0){stopTimer();toast('Süre doldu. Cevabı yine verebilirsin.')}},1000)}
function award(correct,points,label){if(game.locked)return;game.locked=true;stopTimer();if(correct){const discoveries=game.mode==='order'?game.expected:game.mode==='guess'?[game.answer]:[game.pivot];for(const e of discoveries)if(!state.visited.includes(e.id))state.visited.push(e.id);updateProgress()}game.points+=points;if(correct)game.correct++;if(state.settings.players==='teams')state.teams[state.activeTeam].score+=points;state.records.push({mode:game.mode,correct,points,label,team:state.settings.players==='teams'?state.teams[state.activeTeam].name:'Bireysel',date:new Date().toISOString()});state.records=state.records.slice(-500);save();sound(correct)}
function checkOrder(){if(game.locked)return;const ok=game.order.every((e,i)=>e.id===game.expected[i].id);const matched=game.order.filter((e,i)=>e.id===game.expected[i].id).length;award(ok,ok?Math.max(40,100-game.hints*20):Math.round(matched/game.order.length*40),'Kronoloji · '+game.order.length+' olay');game.result=ok;game.feedback=ok?'<strong>Doğru sıralama!</strong> Olaylar erken tarihten geç tarihe ilerliyor.':'<strong>'+matched+'/'+game.order.length+' kart doğru konumda.</strong> Tarihlere bakarak sıralamayı incele; “Doğru sırayı göster” ile karşılaştır.';render()}
function chooseGuess(id){if(game.locked)return;const ok=id===game.answer.id;game.selected=id;award(ok,ok?Math.max(40,130-game.clue*30):0,game.answer.title);game.feedback=(ok?'<strong>Olayı buldun!</strong> ':'<strong>Birlikte öğrenelim.</strong> Doğru cevap: '+game.answer.title+'. ')+game.answer.summary;render()}
function checkChain(){if(game.locked)return;if(!game.pickBefore||!game.pickAfter){toast('Önceki ve sonraki olayı seç.');return}const a=game.pickBefore===game.before.id,b=game.pickAfter===game.after.id,ok=a&&b;award(ok,ok?100:a||b?40:0,game.pivot.title+' · önce–sonra');game.feedback=(ok?'<strong>Bağlantı tamam!</strong> ':'<strong>Çizelgeyi karşılaştır.</strong> ')+game.before.title+' ('+game.before.date+') → '+game.pivot.title+' ('+game.pivot.date+') → '+game.after.title+' ('+game.after.date+').';render()}
function gameView(){if(game.finished)return finishView();const mode=game.mode,team=state.settings.players==='teams'?esc(state.teams[state.activeTeam].name):'Bireysel keşif';return `${scores()}<div class="game-top"><span><strong>${MODES[mode]}</strong> · ${ERAS[state.settings.era]}</span><span>${team} · ${game.round}/${game.total} · ${game.points} puan <span id="timer" class="timer">${state.settings.timer&&!game.locked?(game.seconds??state.settings.timer)+' sn':''}</span></span></div><div class="game-panel">${mode==='order'?orderView():mode==='guess'?guessView():chainView()}<div class="feedback" role="status" aria-live="polite">${game.feedback}</div><div class="game-actions">${game.locked?`<button class="primary" data-action="next">${game.round===game.total?'Sonuçları gör':'Sonraki görev →'}</button>${mode==='order'?'<button data-action="solution">Doğru sırayı göster</button>':`<button data-detail="${mode==='guess'?game.answer.id:game.pivot.id}">Olay kartını incele</button>`}`:mode==='guess'?`<button data-action="clue" ${game.clue>=3?'disabled':''}>Bir ipucu daha (${game.clue}/3)</button><span class="badge">${Math.max(40,130-game.clue*30)} puan</span>`:mode==='order'?'<button class="primary" data-action="checkOrder">Sıralamayı kontrol et</button><button data-action="orderHint">Tarih ipucu · −20 puan</button>':'<button class="primary" data-action="checkChain">Bağlantıyı kontrol et</button>'}<button data-nav="home">Yolculuğa dön</button></div></div>`}
function orderView(){return `<div class="eyebrow">ERKENDEN GEÇE / ${game.order.length} OLAY</div><h2>Zamanın izini bul.</h2><p>Kartları sürükle veya ↑ ↓ düğmeleriyle sırala. Klavyede kartın ok düğmelerini kullanabilirsin.</p><ol class="order-list">${game.order.map((e,i)=>{let cls=game.locked?(e.id===game.expected[i].id?'correct':'wrong'):'';return `<li class="order-item ${cls}" draggable="${!game.locked}" data-drag-index="${i}"><span class="num">${i+1}</span><span class="name">${e.title}${game.hints||game.locked?'<span class="date">'+e.date+'</span>':''}</span>${!game.locked?`<button data-move="${i}" data-dir="-1" aria-label="${esc(e.title)} kartını yukarı taşı" ${i===0?'disabled':''}>↑</button><button data-move="${i}" data-dir="1" aria-label="${esc(e.title)} kartını aşağı taşı" ${i===game.order.length-1?'disabled':''}>↓</button>`:''}</li>`}).join('')}</ol>${game.solution?'<div class="notice"><strong>Doğru sıra</strong><br>'+game.expected.map(e=>e.date+' · '+e.title).join('<br>')+'</div>':''}<p class="helper">Bu görevde yalnızca birbirinden farklı yıllarla tarihlendirilen olaylar kullanılır. Belirsiz tarihler ve aynı yıl içindeki tartışmalı sıralamalar sorulmaz.</p>`}
function guessView(){return `<div class="eyebrow">GİZLİ OLAY / ${game.clue}. İPUCU</div><h2>Ben hangi olayım?</h2><p>Önce sınıfça düşün. Sonra bir olay seç veya yeni ipucu aç.</p><div class="clue-paper">${icon('clue')}<span class="clue-index">İZ ${String(game.clue).padStart(2,'0')}</span><p>${game.answer.clues[game.clue-1]}</p></div>${game.clue>1?'<div class="clue-history">Önceki izler: '+game.answer.clues.slice(0,game.clue-1).join(' · ')+'</div>':''}<div class="choices">${game.options.map((e,i)=>`<button class="choice ${game.locked?(e.id===game.answer.id?'right':e.id===game.selected?'bad':''):''}" data-guess="${e.id}" ${game.locked?'disabled':''}><b>${'ABCD'[i]}</b> ${e.title}</button>`).join('')}</div>`}
function chainView(){const opts=chosen=>'<option value="">Olayı seç…</option>'+game.chainOptions.map(e=>`<option value="${e.id}" ${chosen===e.id?'selected':''}>${e.title}</option>`).join('');return `<div class="eyebrow">ÖĞRENME ÇİZELGESİ / ÖNCE VE SONRA</div><h2>Komşu olayları bul.</h2><p>Aşağıdaki seçili çizelgede, ortadaki olaydan hemen önce ve hemen sonra hangi olay var?</p><div class="chain"><label class="chain-box">ÖNCEKİ OLAY<select id="beforeSelect" ${game.locked?'disabled':''}>${opts(game.pickBefore)}</select></label><div class="chain-box chain-center">${icon(game.pivot.icon)}<small>ORTADAKİ OLAY</small><strong>${game.pivot.title}</strong></div><label class="chain-box">SONRAKİ OLAY<select id="afterSelect" ${game.locked?'disabled':''}>${opts(game.pickAfter)}</select></label></div><details><summary class="key">Bu görevin çizelgesindeki olay adları</summary><p class="helper">${shuffleStable(game.timeline).map(e=>e.title).join(' · ')}</p></details><p class="helper">Yalnızca bu seçili çizelgedeki komşular aranır. Bu ilişki, doğrudan sebep–sonuç anlamına gelmez.</p>`}
function shuffleStable(list){return [...list].sort((a,b)=>a.title.localeCompare(b.title,'tr'))}
function finishView(){return `${scores()}<div class="game-panel finish">${icon('compass')}<div class="eyebrow">BİR DURAK DAHA TAMAMLANDI</div><h2>İzleri birleştirdin.</h2><p>${MODES[game.mode]} · ${game.total} görev tamamlandı.</p><div class="metrics"><div class="metric"><strong>${game.correct}/${game.total}</strong><span>TAM DOĞRU</span></div><div class="metric"><strong>${game.points}</strong><span>OTURUM PUANI</span></div><div class="metric"><strong>${Math.round(game.correct/game.total*100)}%</strong><span>DOĞRULUK</span></div></div><div class="row"><button class="primary" data-play="${game.mode}">Yeniden oyna</button><button data-nav="report">Keşif raporunu aç</button><button data-nav="home">Ana yolculuk</button></div></div>`}
function settingsView(){return `<div class="view-head"><div><div class="eyebrow">SINIFI HAZIRLA / ÖĞRETMEN MASASI</div><h1>Birlikte keşfedelim.</h1><p>Ayarlar yeni başlatılan oyunda uygulanır. Devam eden bir görev varsa bu bölüme geçmek görevin süresini durdurur.</p></div></div><div class="settings-grid"><section class="box"><h3>Oyun düzeni</h3><label class="field">Katılım<select data-setting="players"><option value="individual" ${state.settings.players==='individual'?'selected':''}>Bireysel / sınıfça</option><option value="teams" ${state.settings.players==='teams'?'selected':''}>Takımlı oyun</option></select></label><label class="field">Çalışma dönemi<select data-setting="era">${Object.entries(ERAS).map(([k,v])=>`<option value="${k}" ${state.settings.era===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Sıralama zorluğu<select data-setting="size">${[4,5,6].map(n=>`<option value="${n}" ${state.settings.size===n?'selected':''}>${n} kart${n===4?' · Başlangıç':n===5?' · Orta':' · İleri'}</option>`).join('')}</select></label><label class="field">Görev sayısı<select data-setting="rounds">${[4,6,8].map(n=>`<option value="${n}" ${state.settings.rounds===n?'selected':''}>${n} görev</option>`).join('')}</select></label><label class="field">Düşünme süresi<select data-setting="timer">${[0,30,60].map(n=>`<option value="${n}" ${state.settings.timer===n?'selected':''}>${n?n+' saniye':'Süresiz'}</option>`).join('')}</select></label><p class="helper">Süre dolunca cevap kapanmaz ve puan silinmez. Hicret bölümünde az sayıda farklı tarih bulunduğundan kronoloji oyunları için “Tüm yolculuk” daha uygundur.</p><div class="row"><button class="primary" data-play="order">Sıralamayı başlat</button><button data-play="guess">İpucu oyununu başlat</button><button data-play="chain">Önce–sonrayı başlat</button></div></section><section class="box"><h3>Takımlar ve puanlar</h3><label class="field">Takım sayısı<select id="teamCount">${[2,3,4].map(n=>`<option value="${n}" ${state.teams.length===n?'selected':''}>${n} takım</option>`).join('')}</select></label><div class="team-fields">${state.teams.map((t,i)=>`<label>${i+1}. takım<input maxlength="24" data-team-name="${i}" value="${esc(t.name)}" aria-label="${i+1}. takım adı"></label>`).join('')}</div><p class="helper">Takım adları ve ayarlar bu tarayıcıda saklanır. Her yeni görevde sıra sonraki takıma geçer. Doğru cevap puanı otomatik eklenir.</p>${state.teams.map((t,i)=>`<div class="settings-score"><span>${esc(t.name)}</span><button data-manual="${i}" data-points="-10" aria-label="${esc(t.name)} puanını 10 azalt">−10</button><strong>${t.score}</strong><button data-manual="${i}" data-points="10" aria-label="${esc(t.name)} puanını 10 artır">+10</button></div>`).join('')}<button data-action="undoManual" ${!state.lastManual?'disabled':''}>Son elle puan işlemini geri al</button><p class="helper">Elle verilen puanlar öğretmen değerlendirmesidir; görev doğruluk oranını değiştirmez.</p></section></div><div class="box" style="margin-top:20px"><h3>Puanlama nasıl çalışır?</h3><p>Sıralama: ilk denemede doğruya 100; tarih ipucuyla 80. Yanlışta doğru konumdaki kartların oranına göre en fazla 40 puan. İpucu oyunu: 1., 2. ve 3. ipucunda sırasıyla 100, 70 ve 40 puan. Önce–sonra: iki taraf doğruysa 100, tek taraf doğruysa 40 puan. Yanlış cevap puan silmez.</p><div class="row"><button data-nav="sources">Kaynaklar ve içerik notları</button><button data-action="export">Oturumu JSON olarak indir</button><button class="danger" data-action="reset">Yeni oturum / sıfırla</button></div></div>`}
function reportView(){let records=state.records,total=records.length,correct=records.filter(r=>r.correct).length,points=records.reduce((s,r)=>s+r.points,0);const level=state.visited.length>=24?'Yolculuk rehberi':state.visited.length>=12?'İz sürücü':state.visited.length>=6?'Meraklı kâşif':'İlk adımlar';return `<div class="view-head"><div><div class="eyebrow">KEŞİF RAPORU / BU TARAYICI</div><h1>Her keşif bir iz bırakır.</h1><p>Bu rapor sınıf etkinliğini izlemek içindir; öğrenci notu veya bireysel başarı ölçümü değildir.</p></div><span class="badge">${level}</span></div>${scores()}<div class="metrics"><div class="metric"><strong>${state.visited.length}/24</strong><span>KEŞFEDİLEN KART</span></div><div class="metric"><strong>${total?Math.round(correct/total*100):0}%</strong><span>TAM DOĞRU GÖREV</span></div><div class="metric"><strong>${points}</strong><span>OYUN PUANI</span></div></div><div class="settings-grid"><div class="box"><h3>Oyunlara göre keşif</h3><ul class="report-list">${Object.entries(MODES).map(([k,v])=>{let r=records.filter(x=>x.mode===k);return '<li><span>'+v+'</span><strong>'+r.filter(x=>x.correct).length+'/'+r.length+' doğru</strong></li>'}).join('')}</ul><p class="helper">Son 500 görev tutulur. Kısmen doğru görevler puan kazandırabilir; doğruluk oranında tam doğru sayılmaz.</p><button data-action="export">Raporu indir ↓</button></div><div class="box"><h3>Son görevler</h3>${total?'<ul class="report-list">'+records.slice(-6).reverse().map(r=>'<li><span>'+esc(r.label)+'<br><small>'+esc(r.team)+'</small></span><strong>'+r.points+' puan</strong></li>').join('')+'</ul>':'<p class="empty">İlk görevini tamamladığında izlerin burada görünecek.</p>'}</div></div><div class="section-line"><h2>Henüz açılmayan kartlar</h2></div><div class="row">${EVENTS.filter(e=>!state.visited.includes(e.id)).slice(0,8).map(e=>`<button data-detail="${e.id}">${e.title}</button>`).join('')||'<p>Tüm kartları keşfettin. Değer sorularına yeniden göz atabilirsin.</p>'}</div>`}
function sourcesView(){let urls=[...new Set(EVENTS.map(e=>e.source))];return `<div class="view-head"><div><div class="eyebrow">İÇERİĞİN İZİ / KAYNAKLAR</div><h1>Bilgiye kaynağından bak.</h1><p>Olay anlatımları TDV İslâm Ansiklopedisi maddelerinden yararlanılarak özgün ve kısa eğitim metinleri olarak hazırlanmıştır.</p></div></div><div class="box"><h3>Tarihlendirme ve öğretmen notu</h3><p class="source-note">Doğum yılı, evlilik tarihi, boykotun başlangıç ve bitişi, hüzün yılı ve isrâ–mi‘racın tarihi için kaynaklarda farklı tarihlendirmeler bulunur. Bu kartlarda yaklaşık veya dönem belirten ifadeler kullanılmıştır. Kesin kronoloji görevleri, farklı yıllara ait ve tarihi açık seçilmiş olaylarla sınırlıdır. Aynı yılın olayları arasında kesin sıra sorulmaz.</p><p class="source-note">Kartların önceki/sonraki düğmeleri öğretim sırasıdır. Önce–sonra oyununda yalnızca belirtilen seçili çizelgenin komşuları aranır. Değer yorumları ve tartışma soruları öğretim amaçlıdır; tarihî bir söz veya doğrudan alıntı değildir. Kullanılan mimari ve doğa çizimleri semboliktir.</p><p class="source-note">İçerik kontrolü: 7 Kasım 2026. Belirli bir sınıf ders kitabının birebir veya eksiksiz müfredat aktarımı olduğu iddia edilmez.</p><div class="sources">${urls.map(u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">TDV · ${u.split('/').pop().replaceAll('-',' ')} ↗</a>`).join('')}</div></div>`}
function render(){let html=view==='home'?home():view==='library'?library():view==='game'?gameView():view==='settings'?settingsView():view==='report'?reportView():sourcesView();$('main').innerHTML=html+foot();updateProgress()}
let dragged=null;
document.addEventListener('dragstart',e=>{const row=e.target.closest('[data-drag-index]');if(!row||game?.locked)return;dragged=+row.dataset.dragIndex;e.dataTransfer.setData('text/plain',String(dragged));e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{if(e.target.closest('[data-drag-index]'))e.preventDefault()});
document.addEventListener('drop',e=>{const row=e.target.closest('[data-drag-index]');if(!row||game?.locked||dragged===null)return;e.preventDefault();const to=+row.dataset.dragIndex;const item=game.order.splice(dragged,1)[0];game.order.splice(to,0,item);dragged=null;render()});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.nav){navigate(b.dataset.nav);return}if(b.dataset.play){startGame(b.dataset.play);return}if(b.dataset.detail){openDetail(b.dataset.detail);return}if(b.dataset.close){$(b.dataset.close).close();return}if(b.dataset.eraLibrary){libraryEra=b.dataset.eraLibrary;query='';navigate('library');return}if(b.dataset.libraryFilter){libraryEra=b.dataset.libraryFilter;render();return}if(b.dataset.move!==undefined){const i=+b.dataset.move,j=i+(+b.dataset.dir);if(game&&!game.locked&&j>=0&&j<game.order.length){[game.order[i],game.order[j]]=[game.order[j],game.order[i]];render();document.querySelector('[data-move="'+j+'"][data-dir="'+b.dataset.dir+'"]')?.focus({preventScroll:true})}return}if(b.dataset.guess){chooseGuess(b.dataset.guess);return}if(b.dataset.manual!==undefined){const i=+b.dataset.manual,old=state.teams[i].score;state.lastManual={index:i,score:old};state.teams[i].score=Math.max(0,old+(+b.dataset.points));save();render();return}switch(b.dataset.action){case'next':nextRound();break;case'checkOrder':checkOrder();break;case'clue':if(!game.locked&&game.clue<3){game.clue++;render()}break;case'orderHint':if(!game.locked){if(game.hints){toast('Tarih ipucu zaten açık.');break}game.hints=1;render()}break;case'solution':game.solution=true;render();break;case'checkChain':checkChain();break;case'reset':$('confirm').showModal();break;case'undoManual':if(state.lastManual){const x=state.lastManual;if(state.teams[x.index])state.teams[x.index].score=x.score;delete state.lastManual;save();render()}break;case'export':{const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='siyer-yolculugu-oturum.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}}});
document.addEventListener('input',e=>{if(e.target.id==='librarySearch'){query=e.target.value;const start=e.target.selectionStart;render();$('librarySearch').focus({preventScroll:true});$('librarySearch').setSelectionRange(start,start)}if(e.target.dataset.teamName!==undefined){state.teams[+e.target.dataset.teamName].name=e.target.value.trim().slice(0,24)||'Takım '+(+e.target.dataset.teamName+1);save()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.setting){state.settings[t.dataset.setting]=['size','rounds','timer'].includes(t.dataset.setting)?+t.value:t.value;save();toast('Oyun ayarı kaydedildi.')}if(t.id==='teamCount'){const n=+t.value;while(state.teams.length<n)state.teams.push({name:['Zümrüt','Kehribar','Turkuaz','Mercan'][state.teams.length],score:0});state.teams=state.teams.slice(0,n);state.activeTeam%=n;delete state.lastManual;save();render()}if(t.id==='beforeSelect')game.pickBefore=t.value;if(t.id==='afterSelect')game.pickAfter=t.value});
$('themeButton').onclick=()=>{state.settings.theme=state.settings.theme==='light'?'dark':'light';applyPrefs();save()};$('soundButton').onclick=()=>{state.settings.sound=!state.settings.sound;applyPrefs();save();sound()};$('detail').addEventListener('close',()=>{if(view==='library'||view==='report')render();returnFocus?.focus({preventScroll:true})});$('resetNo').onclick=()=>$('confirm').close();$('resetYes').onclick=()=>{stopTimer();const prefs=state.settings;state=defaults();state.settings=prefs;save();game=null;$('confirm').close();applyPrefs();navigate('home');toast('Yeni oturum hazır.')};for(const d of document.querySelectorAll('dialog'))d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}});applyPrefs();render();
</script></body></html>
