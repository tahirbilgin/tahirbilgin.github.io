<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Namazı Öğreniyorum</title><style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
:root{--bg:#081c20;--panel:#102e32;--panel2:#174044;--gold:#f5c879;--mint:#80e0bd;--txt:#f7f5ed;--muted:#b2cbc5;--bad:#ff8d93}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#23665b 0%,#0d2b2f 42%,#07181e 100%);color:var(--txt);font-family:Nunito,system-ui,sans-serif;min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.shell{max-width:1100px;margin:auto;padding:22px 20px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px}.logo{width:45px;height:45px;border-radius:14px;background:linear-gradient(135deg,#d7b16c,#ffe5a2);display:grid;place-items:center;color:#16413c;font-size:27px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#ffffff10;border:1px solid #ffffff1b;border-radius:16px;padding:9px 15px;font-size:14px}.stat b{color:var(--gold)}.hero{margin:35px 0 25px;display:grid;grid-template-columns:1.25fr .75fr;gap:25px;align-items:center}.eyebrow{color:var(--mint);letter-spacing:2px;font-weight:900;font-size:12px}.hero h1{font-size:clamp(36px,5.6vw,67px);line-height:1.08;letter-spacing:-2px;margin:15px 0}.hero h1 em{font-style:normal;color:var(--gold)}.hero p{color:var(--muted);line-height:1.8;max-width:550px}.scene{height:270px;border-radius:30px;background:radial-gradient(circle at 50% 30%,#e7bd7255,transparent 55%),linear-gradient(155deg,#245f5b,#0d2b37);position:relative;overflow:hidden;border:1px solid #ffffff2a;display:flex;justify-content:center;align-items:end}.moon{position:absolute;top:29px;right:65px;font-size:55px;color:#ffdb94;text-shadow:0 0 45px #f3d389}.mosque{font-size:170px;line-height:1;filter:drop-shadow(0 8px 20px #071b24);margin-bottom:-8px}.stars{position:absolute;inset:0;color:#ffe6ad;letter-spacing:25px;font-size:20px;opacity:.65;padding:20px}.primary,.secondary,.smallbtn{border:0;border-radius:15px;padding:13px 20px;font-weight:900;transition:.2s}.primary{background:linear-gradient(135deg,#ffe3a3,#d9a951);color:#173a36;box-shadow:0 9px 30px #d9a95122}.secondary{background:#ffffff12;color:var(--txt);border:1px solid #ffffff24}.primary:hover,.secondary:hover,.tile:hover,.smallbtn:hover{transform:translateY(-2px);filter:brightness(1.08)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.tile{background:linear-gradient(145deg,#17413f,#102e35);border:1px solid #ffffff22;border-radius:23px;padding:22px;cursor:pointer;transition:.2s;text-align:left;color:var(--txt);min-height:165px}.tile .emoji{font-size:33px}.tile h3{font-size:19px;margin:10px 0 4px}.tile p{color:var(--muted);margin:0;font-size:13px;line-height:1.5}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:22px 0}.sectionhead h2{font-size:29px;margin:0}.panel{background:linear-gradient(145deg,#14393b,#102c34);border:1px solid #ffffff24;border-radius:24px;padding:25px;margin:18px 0}.muted{color:var(--muted)}.progress{height:9px;border-radius:20px;background:#ffffff18;overflow:hidden;margin:15px 0}.progress>div{height:100%;background:linear-gradient(90deg,#67d8b0,#f3c677);transition:width .3s}.choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.answer{background:#ffffff0d;color:var(--txt);border:1px solid #ffffff26;border-radius:15px;padding:18px;text-align:left;min-height:65px}.answer:hover:not(:disabled){background:#ffffff1c}.answer.correct{border-color:#75e1b0;background:#1d715d}.answer.wrong{border-color:#ff8d93;background:#70323d}.answer:disabled{cursor:default}.question{font-size:clamp(22px,3vw,32px);font-weight:900;margin:25px 0}.feedback{border-radius:14px;padding:14px 17px;margin-top:18px;background:#ffffff13;line-height:1.6}.flash{max-width:620px;margin:22px auto;perspective:1200px;cursor:pointer}.flashinner{position:relative;height:320px;transition:transform .65s;transform-style:preserve-3d}.flash.flipped .flashinner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid #f4c87866;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:linear-gradient(150deg,#27675c,#123c40);box-shadow:0 20px 45px #0003}.face.back{transform:rotateY(180deg);background:linear-gradient(150deg,#6a5b35,#173f40)}.face .symbol{font-size:54px}.face h2{font-size:32px;margin:15px 0}.face p{line-height:1.7}.row{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}.pill{border:1px solid #ffffff30;background:#ffffff10;padding:8px 13px;border-radius:99px;color:var(--txt);font-weight:800}.pill.active{background:var(--gold);color:#183e39}.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.matchcol{display:grid;gap:10px;align-content:start}.match{padding:15px;border:1px solid #ffffff35;border-radius:13px;background:#ffffff0c;color:white;text-align:left;min-height:68px}.match.selected{border-color:var(--gold);background:#806b3b}.match.done{opacity:.35;pointer-events:none;background:#22765e}.badgegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.badgeitem{padding:20px;border-radius:16px;background:#ffffff10;text-align:center}.badgeitem.locked{filter:grayscale(1);opacity:.45}.badgeitem span{font-size:32px}.mini{font-size:13px;color:var(--muted)}.footer{text-align:center;color:#94b1aa;font-size:12px;margin-top:50px}.result{text-align:center;padding:35px 10px}.result strong{font-size:55px;color:var(--gold)}@media(max-width:750px){.hero{grid-template-columns:1fr}.scene{height:190px}.mosque{font-size:130px}.grid,.badgegrid{grid-template-columns:1fr 1fr}.hero h1{font-size:42px}.choicegrid{grid-template-columns:1fr}}@media(max-width:480px){.grid,.badgegrid{grid-template-columns:1fr}.shell{padding:15px}.panel{padding:17px}.match{font-size:13px;padding:10px}.flashinner{height:300px}.face h2{font-size:25px}}
</style></head><body><div id="app"></div><script>
const cards=[
['Hadesten Taharet','Abdest veya gerektiğinde gusül alarak hükmî kirlilikten temizlenmek.','Dışındaki şartlar','💧'],
['Necasetten Taharet','Bedenin, elbisenin ve namaz kılınacak yerin dinen pis sayılan maddelerden temiz olması.','Dışındaki şartlar','✨'],
['Setr-i Avret','Namazda örtülmesi gereken vücut bölgelerini örtmek.','Dışındaki şartlar','🧥'],
['İstikbal-i Kıble','Namazda Kâbe’nin bulunduğu kıble yönüne dönmek.','Dışındaki şartlar','🧭'],
['Vakit','Namazı belirlenmiş vakti içerisinde kılmak.','Dışındaki şartlar','🕰️'],
['Niyet','Kılınacak namaza kalben niyet etmek.','Dışındaki şartlar','🤲'],
['İftitah Tekbiri','Namaza “Allahu Ekber” diyerek başlamak.','İçindeki farzlar','🌟'],
['Kıyam','Gücü yeten kişinin namazda ayakta durması.','İçindeki farzlar','🧍'],
['Kıraat','Namazda Kur’an-ı Kerim’den ayet veya sure okumak.','İçindeki farzlar','📖'],
['Rükû','Namazda eğilmek.','İçindeki farzlar','🌿'],
['Secde','Alnı ve burnu yere koyarak secde etmek.','İçindeki farzlar','🌙'],
['Ka’de-i Ahire','Namazın sonunda teşehhüt okuyacak kadar oturmak.','İçindeki farzlar','🕌']
];
const extra=[
['Namazın dışındaki şartları kaç tanedir?',['6','4','5','7'],0,'Namazın dışındaki şartlar altı tanedir.'],
['Namazın içindeki farzları kaç tanedir?',['6','3','7','5'],0,'Namazın içindeki farzlar altı tanedir.'],
['Namazın dışındaki ve içindeki farzlar toplam kaç tanedir?',['12','10','14','8'],0,'Altı dış şart ve altı iç farz toplam 12 eder.'],
['Aşağıdakilerden hangisi namazın içindeki farzlardandır?',['Rükû','Vakit','Niyet','Necasetten Taharet'],0,'Rükû namazın içindeki farzlardandır.'],
['Aşağıdakilerden hangisi namazın dışındaki şartlardandır?',['İstikbal-i Kıble','Secde','Kıyam','Kıraat'],0,'Kıbleye yönelmek namazın dışındaki şartlardandır.'],
['Hangisi namazın sonunda yerine getirilir?',['Ka’de-i Ahire','İftitah Tekbiri','Niyet','Vakit'],0,'Ka’de-i Ahire son oturuştur.']
];
let saved={};try{saved=JSON.parse(localStorage.getItem('namazGameSave')||'{}')}catch(e){}
let state={xp:saved.xp||0,stars:saved.stars||0,seen:saved.seen||[],review:saved.review||[],ach:saved.ach||[],quizCount:saved.quizCount||0,correctTotal:saved.correctTotal||0,perfect:saved.perfect||0,daily:saved.daily||{},date:saved.date||'',page:'home',cat:0,ci:0,flipped:false,quiz:[],qi:0,selected:null,score:0,correct:0,streak:0,mode:'quiz',match:[],left:null,matched:[],matchWrong:false};
const today=()=>new Date().toLocaleDateString('sv-SE');
if(state.date!==today()){state.daily={cards:0,answers:0,streak:0,match:0};state.date=today()}
function save(){let keys=['xp','stars','seen','review','ach','quizCount','correctTotal','perfect','daily','date'];localStorage.setItem('namazGameSave',JSON.stringify(Object.fromEntries(keys.map(k=>[k,state[k]]))))}
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function award(x){state.xp+=x;state.stars+=Math.max(0,Math.floor(x/10));checkAch();save()}
function checkAch(){let a=[];if(state.seen.length)a.push('İlk Adım');if(state.seen.length>=6)a.push('Bilgi Kaşifi');if(state.seen.length===12)a.push('Namaz Bilgini');if(state.quizCount>=5)a.push('Hafıza Ustası');if(state.perfect)a.push('Hatasız Şampiyon');if(state.xp>=500)a.push('Öğrenme Yolculuğu');state.ach=[...new Set([...state.ach,...a])]}
function shell(body){let lv=Math.min(20,1+Math.floor(state.xp/150));$('#app').innerHTML=`<div class="shell"><header class="top"><div class="brand" style="cursor:pointer" onclick="go('home')"><div class="logo">☪</div> Namazı Öğreniyorum</div><div class="stats"><div class="stat">⭐ <b>${state.stars}</b> Yıldız</div><div class="stat">🏅 <b>Seviye ${lv}</b></div><div class="stat">✨ <b>${state.xp}</b> XP</div></div></header>${body}<div class="footer">Öğren • Pekiştir • Başar &nbsp; | &nbsp; İlerlemen bu cihazda saklanır.</div></div>`}
function head(title){return `<div class="sectionhead"><h2>${title}</h2><button class="secondary" onclick="go('home')">← Ana Menü</button></div>`}
function go(page){state.page=page;state.selected=null;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){if(state.page==='home')home();else if(state.page==='cards')flash();else if(state.page==='quiz')quizRender();else if(state.page==='match')matchRender();else if(state.page==='truefalse')tfRender();else if(state.page==='daily')dailyRender();else if(state.page==='ach')achRender();else if(state.page==='help')helpRender();else if(state.page==='settings')settingsRender()}
function home(){shell(`<div class="hero"><div><div class="eyebrow">✦ BİLGİYLE BÜYÜYEN BİR YOLCULUK</div><h1>Öğrenmenin <em>en güzel</em> hâli.</h1><p>Namazın 12 temel şartını keşfet, kartları çevir, soruları yanıtla ve yıldızları topla. Her gün biraz daha öğren!</p><div class="actions"><button class="primary" onclick="startQuiz('quiz')">▶ Oyuna Başla</button><button class="secondary" onclick="go('cards')">📚 Kartları Keşfet</button></div></div><div class="scene"><div class="stars">✦ · ✧ · ✦</div><div class="moon">☾</div><div class="mosque">🕌</div></div></div><div class="sectionhead"><h2>Oyun dünyan</h2><span class="muted">${state.seen.length}/12 kart öğrenildi</span></div><div class="grid">${[['📚','Dijital Kartlar','Kartları çevir, kavramları öğren.','cards'],['🏆','Bilgi Yarışması','Dört seçenekli sorularla kendini dene.','quiz'],['🧩','Eşleştirme','Kavramlarla anlamları birleştir.','match'],['⚡','Doğru mu, Yanlış mı?','Bilgini hızlıca test et.','truefalse'],['🎯','Günlük Görevler','Bugünkü hedeflerini tamamla.','daily'],['🎖️','Başarılarım','Kazandığın rozetleri gör.','ach'],['❔','Nasıl Oynanır','Oyun kurallarını öğren.','help'],['⚙️','Ayarlar','İlerlemeni yönet.','settings']].map(([e,t,d,p])=>`<button class="tile" onclick="${p==='quiz'?"startQuiz('quiz')":p==='match'?'startMatch()':p==='truefalse'?"startQuiz('truefalse')":`go('${p}')`}" ><div class="emoji">${e}</div><h3>${t}</h3><p>${d}</p></button>`).join('')}</div>`)}
function flash(){let c=cards[state.ci],list=cards.map((_,i)=>i).filter(i=>state.cat===0||cards[i][2]===(state.cat===1?'Dışındaki şartlar':'İçindeki farzlar'));if(!list.includes(state.ci))state.ci=list[0];c=cards[state.ci];let ix=list.indexOf(state.ci);shell(head('📚 Dijital Öğrenme Kartları')+`<div class="panel"><div class="row">${['Tümü','Dışındaki şartlar','İçindeki farzlar'].map((t,i)=>`<button class="pill ${state.cat===i?'active':''}" onclick="setCat(${i})">${t}</button>`).join('')}</div><div class="progress"><div style="width:${(ix+1)/list.length*100}%"></div></div><div class="mini" style="text-align:center">${ix+1} / ${list.length} · Kartı çevirmek için dokun</div><div class="flash ${state.flipped?'flipped':''}" onclick="flip()"><div class="flashinner"><div class="face"><div class="symbol">${c[3]}</div><h2>${esc(c[0])}</h2><span class="mini">${esc(c[2])}</span><p>↻ Açıklamayı görmek için çevir</p></div><div class="face back"><div class="symbol">✦</div><h2>${esc(c[0])}</h2><p>${esc(c[1])}</p></div></div></div><div class="row"><button class="secondary" onclick="moveCard(-1)">← Önceki</button><button class="primary" onclick="learnCard()">${state.seen.includes(state.ci)?'✓ Öğrenildi':'✓ Öğrendim'}</button><button class="secondary" onclick="moveCard(1)">Sonraki →</button><button class="secondary" onclick="reviewCard()">↻ Tekrar Et</button></div><p class="mini" style="text-align:center">Öğrenilen: ${state.seen.length}/12 · Tekrar listesi: ${state.review.length}</p></div>`)}
function setCat(i){state.cat=i;state.ci=i===2?6:0;state.flipped=false;render()}
function flip(){state.flipped=!state.flipped;render()}
function moveCard(d){let list=cards.map((_,i)=>i).filter(i=>state.cat===0||cards[i][2]===(state.cat===1?'Dışındaki şartlar':'İçindeki farzlar'));state.ci=list[(list.indexOf(state.ci)+d+list.length)%list.length];state.flipped=false;render()}
function learnCard(){if(!state.seen.includes(state.ci)){state.seen.push(state.ci);state.daily.cards++;award(10);if(state.seen.filter(i=>i<6).length===6||state.seen.filter(i=>i>=6).length===6){if([6,12].includes(state.seen.length))award(50)}}state.review=state.review.filter(i=>i!==state.ci);save();moveCard(1)}
function reviewCard(){if(!state.review.includes(state.ci))state.review.push(state.ci);save();moveCard(1)}
function makeQuestions(){let q=[];cards.forEach((c,i)=>{let distract=shuffle(cards.map(x=>x[0]).filter(x=>x!==c[0])).slice(0,3);let options=shuffle([c[0],...distract]);q.push({q:`"${c[1]}" açıklaması hangi kavrama aittir?`,options,correct:options.indexOf(c[0]),why:c[0]+' — '+c[1],card:i});let defs=shuffle(cards.filter((_,j)=>j!==i).map(x=>x[1])).slice(0,3);options=shuffle([c[1],...defs]);q.push({q:`${c[0]} ne anlama gelir?`,options,correct:options.indexOf(c[1]),why:c[1],card:i});let same=cards.map((x,j)=>({x,j})).filter(x=>x.j!==i&&x.x[2]!==c[2]);let wrong=shuffle(same).slice(0,3).map(x=>x.x[0]);options=shuffle([c[0],...wrong]);q.push({q:`Aşağıdakilerden hangisi namazın ${c[2].toLowerCase()} grubundadır?`,options,correct:options.indexOf(c[0]),why:`${c[0]}: ${c[2]}.`,card:i})});extra.forEach(([t,opts,idx,why])=>q.push({q:t,options:opts,correct:idx,why,card:0}));return q}
const bank=makeQuestions();
function startQuiz(mode){state.mode=mode;state.page=mode;state.qi=0;state.selected=null;state.score=0;state.correct=0;state.streak=0;state.quiz=shuffle(bank).slice(0,10);render()}
function quizRender(){if(state.qi>=state.quiz.length){finish();return}let q=state.quiz[state.qi];shell(head('🏆 Bilgi Yarışması')+`<div class="panel"><div class="row" style="justify-content:space-between"><span class="pill">Soru ${state.qi+1} / ${state.quiz.length}</span><span class="pill">⭐ ${state.score} Puan</span><span class="pill">🔥 ${state.streak} Seri</span></div><div class="progress"><div style="width:${state.qi/state.quiz.length*100}%"></div></div><div class="question">${esc(q.q)}</div><div class="choicegrid">${q.options.map((o,i)=>`<button class="answer ${state.selected!==null?(i===q.correct?'correct':i===state.selected?'wrong':''):''}" ${state.selected!==null?'disabled':''} onclick="answer(${i})"><b>${'ABCD'[i]}.</b> ${esc(o)}</button>`).join('')}</div>${state.selected!==null?`<div class="feedback">${state.selected===q.correct?'🎉 Harika, doğru cevap!':'💡 Birlikte öğrenelim.'}<br>${esc(q.why)}</div><div class="actions" style="justify-content:flex-end"><button class="primary" onclick="nextQ()"> ${state.qi===state.quiz.length-1?'Sonuçları Gör':'Sonraki Soru →'}</button></div>`:''}</div>`)}
function answer(i){if(state.selected!==null)return;state.selected=i;let q=state.quiz[state.qi];state.daily.answers++;if(i===q.correct){state.correct++;state.streak++;state.correctTotal++;state.score+=10;if(state.streak===3)state.score+=10;if(state.streak===5)state.score+=25;state.daily.streak=Math.max(state.daily.streak,state.streak)}else{state.streak=0;if(!state.review.includes(q.card))state.review.push(q.card)}save();render()}
function nextQ(){state.qi++;state.selected=null;render()}
function finish(){state.quizCount++;if(state.correct===state.quiz.length)state.perfect++;award(state.score);save();let stars=state.correct>=9?3:state.correct>=6?2:1;shell(head('🎉 Yarışma Tamamlandı')+`<div class="panel result"><div style="font-size:60px">🏆</div><h2>Harika bir çalışma!</h2><strong>${state.score}</strong><p>Toplam puanın</p><h2>${'⭐'.repeat(stars)}</h2><p>${state.correct} doğru · ${state.quiz.length-state.correct} yanlış · %${Math.round(state.correct/state.quiz.length*100)} başarı</p><div class="actions" style="justify-content:center"><button class="primary" onclick="startQuiz('quiz')">Yeniden Oyna</button><button class="secondary" onclick="go('cards')">Kartları Tekrar Et</button></div></div>`);state.page='result'}
function startMatch(){state.page='match';state.match=shuffle(cards.map((_,i)=>i)).slice(0,6);state.matchRight=shuffle(state.match);state.left=null;state.matched=[];state.matchWrong=false;render()}
function matchRender(){shell(head('🧩 Eşleştirme Oyunu')+`<div class="panel"><p class="muted">Soldan bir kavram, sağdan doğru açıklamasını seç.</p><div class="progress"><div style="width:${state.matched.length/6*100}%"></div></div><div class="matchgrid"><div class="matchcol">${state.match.map(i=>`<button class="match ${state.left===i?'selected':''} ${state.matched.includes(i)?'done':''}" onclick="chooseLeft(${i})">${esc(cards[i][0])}</button>`).join('')}</div><div class="matchcol">${state.matchRight.map(i=>`<button class="match ${state.matched.includes(i)?'done':''}" onclick="chooseRight(${i})">${esc(cards[i][1])}</button>`).join('')}</div></div><div class="feedback">${state.matched.length===6?'🎉 Tüm eşleştirmeleri tamamladın! +60 XP':state.matchWrong?'Tekrar dene! Eşleşmelerin anlamlarını dikkatle oku.':`${state.matched.length}/6 eşleşme tamamlandı.`}</div>${state.matched.length===6?'<button class="primary" onclick="startMatch()">Yeniden Oyna</button>':''}</div>`)}
function chooseLeft(i){if(state.matched.includes(i))return;state.left=i;state.matchWrong=false;render()}
function chooseRight(i){if(state.left===null||state.matched.includes(i))return;if(i===state.left){state.matched.push(i);state.matchWrong=false;award(10);if(state.matched.length===6)state.daily.match++}else state.matchWrong=true;state.left=null;save();render()}
function tfRender(){if(state.qi>=state.quiz.length){finish();return}let q=state.quiz[state.qi],statement=state.qi%2===0?q.options[q.correct]:q.options[(q.correct+1)%4],truth=state.qi%2===0;shell(head('⚡ Doğru mu, Yanlış mı?')+`<div class="panel"><div class="row"><span class="pill">Soru ${state.qi+1}/10</span><span class="pill">${state.score} puan</span></div><div class="progress"><div style="width:${state.qi*10}%"></div></div><p class="muted">${esc(q.q)}</p><div class="question">${esc(statement)}</div><div class="choicegrid"><button class="answer ${state.selected!==null?(truth?'correct':state.selected===true?'wrong':''):''}" onclick="tfAnswer(true)" ${state.selected!==null?'disabled':''}>✓ Doğru</button><button class="answer ${state.selected!==null?(!truth?'correct':state.selected===false?'wrong':''):''}" onclick="tfAnswer(false)" ${state.selected!==null?'disabled':''}>✕ Yanlış</button></div>${state.selected!==null?`<div class="feedback">${state.selected===truth?'🎉 Doğru bildin!':'💡 Bir sonraki soruda daha iyi olacak.'} ${esc(q.why)}</div><div class="actions"><button class="primary" onclick="nextQ()">Devam Et →</button></div>`:''}</div>`)}
function tfAnswer(v){if(state.selected!==null)return;state.selected=v;let truth=state.qi%2===0;state.daily.answers++;if(v===truth){state.correct++;state.streak++;state.correctTotal++;state.score+=10;if(state.streak===3)state.score+=10;if(state.streak===5)state.score+=25;state.daily.streak=Math.max(state.daily.streak,state.streak)}else state.streak=0;save();render()}
function dailyRender(){let missions=[['📚 5 kart öğren',state.daily.cards,5],['🧠 10 soruya cevap ver',state.daily.answers,10],['🔥 5 doğru seri yap',state.daily.streak,5],['🧩 1 eşleştirme bitir',state.daily.match,1]];shell(head('🎯 Günlük Görevler')+`<div class="panel"><p class="muted">Görevler her gün yenilenir. Bugünün tarihi: ${today()}</p>${missions.map(([t,n,max])=>`<div style="padding:12px 0;border-bottom:1px solid #ffffff20"><b>${t}</b><span style="float:right">${Math.min(n,max)}/${max} ${n>=max?'✓':''}</span><div class="progress"><div style="width:${Math.min(100,n/max*100)}%"></div></div></div>`).join('')}</div>`)}
function achRender(){let items=[['🌱','İlk Adım','İlk kartını öğren.'],['🧭','Bilgi Kaşifi','6 kart öğren.'],['🕌','Namaz Bilgini','12 kartın tamamını öğren.'],['🧠','Hafıza Ustası','5 yarışma tamamla.'],['🏆','Hatasız Şampiyon','Bir yarışmayı hatasız bitir.'],['✨','Öğrenme Yolculuğu','500 XP kazan.']];shell(head('🎖️ Başarılarım')+`<div class="badgegrid">${items.map(([e,t,d])=>`<div class="badgeitem ${state.ach.includes(t)?'':'locked'}"><span>${e}</span><h3>${t}</h3><p class="mini">${d}</p><b>${state.ach.includes(t)?'✓ Kazanıldı':'🔒 Kilitli'}</b></div>`).join('')}</div>`)}
function helpRender(){shell(head('❔ Nasıl Oynanır?')+`<div class="panel"><h3>📚 Dijital Kartlar</h3><p>Kartı tıklayarak arkasını çevir, açıklamayı oku ve “Öğrendim” ile ilerle. Zorlandığın kartı “Tekrar Et” ile işaretle.</p><h3>🏆 Bilgi Yarışması</h3><p>Her soruda dört seçenekten doğru olanı seç. Doğru yanıt +10 puan kazandırır. Üç ve beş soruluk doğru seriler bonus getirir.</p><h3>🧩 Eşleştirme</h3><p>Bir kavram ve karşılık gelen tanımı seçerek altı eşleştirmeyi tamamla.</p><h3>⚡ Doğru mu, Yanlış mı?</h3><p>Gösterilen cevap önerisinin soruya uygun olup olmadığına karar ver.</p><h3>⭐ İlerleme</h3><p>XP kazan, rozetleri aç ve günlük görevlerini tamamla. İlerlemen tarayıcında otomatik kaydedilir.</p></div>`)}
function settingsRender(){shell(head('⚙️ Ayarlar')+`<div class="panel"><h3>İlerleme verileri</h3><p class="muted">İlerlemen yalnızca bu tarayıcıda saklanır.</p><button class="secondary" onclick="if(confirm('Tüm ilerlemen silinsin mi?')){localStorage.removeItem('namazGameSave');location.reload()}">🗑️ İlerlemeyi Sıfırla</button></div>`)}
render();
</script>
